<body data-profile="viewer"><header><div><strong>Avalia Top</strong></div><label>Perfil<select id="role"><option value="home">Pré-avaliação</option><option value="viewer">Visualizador</option><option value="master">Usuário mestre</option></select></label></header>
<main><nav aria-label="Áreas"></nav><h1></h1><p id="intro"></p><p id="status" role="status"></p><section id="content"></section></main>

<template id="pre-template"><form id="pre-form">
<p id="pre-progress" class="pre-progress" aria-live="polite"></p>
<ol class="pre-steps" aria-label="Etapas"><li>Seus dados</li><li>Veículo</li><li>Checklist</li></ol>
<fieldset><legend>Dados pessoais</legend>
<label>Nome<input name="owner" autocomplete="name" maxlength="120" required></label>
<label>Telefone / WhatsApp<input name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="(65) 99999-0000" pattern="\([0-9]{2}\) [0-9]{4,5}-[0-9]{4}" required></label>
<label>Cidade<input name="city" list="pre-cities" placeholder="Digite ou escolha a cidade" autocomplete="address-level2" maxlength="100" required></label><datalist id="pre-cities"></datalist></fieldset>
<fieldset hidden disabled><legend>Carro, foto e vídeo</legend>
<label>Placa<input name="plate" maxlength="7" pattern="[A-Za-z]{3}[0-9][A-Za-z0-9][0-9]{2}" placeholder="ABC1D23" autocapitalize="characters" required></label>
<label>Marca<input name="brand" list="pre-brands" maxlength="40" placeholder="Digite ou escolha a marca" required></label><datalist id="pre-brands"></datalist>
<label>Modelo<input name="model" list="pre-models" maxlength="79" placeholder="Digite ou escolha o modelo" required></label><datalist id="pre-models"></datalist>
<label>Ano-modelo<input name="year" type="number" min="1886" max="2100" required></label>
<label>Quilometragem<input name="km" type="number" min="0" required></label>

<button id="pre-next" class="primary">Continuar</button></div></form></template>
<script>

const citySuggestions = ['Tangará da Serra','Barra do Bugres','Campo Novo do Parecis','Sapezal','Nova Olímpia','Denise','Arenápolis','Nortelândia','Santo Afonso','Diamantino','Nova Marilândia','São José do Rio Claro','Cuiabá','Várzea Grande','Lucas do Rio Verde','Nova Mutum','Sorriso','Sinop','Rondonópolis','Cáceres','Pontes e Lacerda','Juína','Brasnorte'];
const vehicleSuggestions = {
  Chevrolet:['Onix','Onix Plus','Spin','Tracker','S10','Montana','Cruze','Celta','Prisma','Classic','Cobalt'],
  Fiat:['Strada','Toro','Argo','Cronos','Mobi','Uno','Palio','Pulse','Fastback','Fiorino','Siena'],
  Ford:['EcoSport','Ka','Fiesta','Focus','Ranger','Fusion','Territory'],
  Volkswagen:['Gol','Polo','Virtus','Saveiro','Voyage','T-Cross','Nivus','Amarok','Fox','Jetta','Taos'],
  Toyota:['Corolla','Corolla Cross','Hilux','SW4','Yaris','Etios'],
  Hyundai:['HB20','HB20S','Creta','Tucson','ix35'],
  Honda:['Civic','City','Fit','HR-V','WR-V','ZR-V'],
  Renault:['Kwid','Sandero','Logan','Duster','Oroch','Captur','Kardian'],
  Jeep:['Renegade','Compass','Commander'],
  Nissan:['Kicks','Versa','March','Frontier','Sentra'],
  Mitsubishi:['L200','Outlander','ASX','Pajero Sport','Eclipse Cross'],
  Peugeot:['208','2008','308','3008','Partner'],
  'Citroën':['C3','C4 Cactus','Aircross','Basalt'],
  BYD:['Dolphin','Dolphin Mini','Song Plus','Yuan Plus','Seal'],
  GWM:['Haval H6','Ora 03','Poer'],
  Kia:['Sportage','Cerato','Soul','Picanto'],
  Suzuki:['Jimny','Vitara','S-Cross'],
  BMW:['Série 3','X1','X3'],
  'Mercedes-Benz':['Classe A','Classe C','GLA','GLC'],
  Audi:['A3','A4','Q3','Q5'],
  Volvo:['XC40','XC60','EX30'],
  Ram:['Rampage','1500','2500']
};
function configureCustomerFields(form) {
  const {phone,brand,model} = form.elements;
  function populate(id,values) {
    $(id).replaceChildren(...values.map(value => new Option(value,value)));
  }
  populate('#pre-cities',citySuggestions);
  populate('#pre-brands',Object.keys(vehicleSuggestions).sort((a,b) => a.localeCompare(b,'pt-BR')));
  brand.addEventListener('input',() => {
    const key = Object.keys(vehicleSuggestions).find(name =>
      name.localeCompare(brand.value.trim(),'pt-BR',{sensitivity:'base'}) === 0);
    populate('#pre-models',key ? vehicleSuggestions[key] : []);
  });
  phone.addEventListener('input',() => {
    let digits = phone.value.replace(/\D/g,'');
    if (digits.length > 11 && digits.startsWith('55')) digits = digits.slice(2);
    digits = digits.slice(0,11);
    const area = digits.slice(0,2);
    const local = digits.slice(2);
    const split = digits.length === 11 ? 5 : 4;
    phone.value = digits.length < 3 ? (area ? '('+area : '') :
      '('+area+') '+local.slice(0,split)+(local.length > split ? '-'+local.slice(split) : '');
    phone.setCustomValidity(digits.length >= 10 || !digits.length ? '' : 'Informe o DDD e o telefone completo.');
  });
}

const $ = selector => document.querySelector(selector);
const money = new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const number = new Intl.NumberFormat('pt-BR');
const date = new Intl.DateTimeFormat('pt-BR',{dateStyle:'medium'});

const checks = [
 ['Porta esquerda',250,700],['Porta direita',250,700],['Para-choque dianteiro',250,650],
 ['Para-choque traseiro',250,650],['Capô e teto',350,1000],['Pneus',400,1200],
 ['Suspensão',450,1400],['Freios',350,950],['Motor',650,2200],['Câmbio',650,2200],
 ['Para-brisa',350,1200],['Faróis',250,850],['Ar-condicionado',400,1400],
 ['Bancos e estofamento',250,750],['Painel e comandos',300,1000],['Vidros e travas elétricas',250,800]
];
const checkSections = [
  ['Estrutura e exterior',[0,1,2,3,4,10,11]],
  ['Interior e conforto',[12,13,14,15]],
  ['Motor e câmbio',[8,9]],
  ['Suspensão, pneus e freios',[6,5,7]]
];
const options = index => index === 10 ? ['Sem avarias','Riscado ou lascado','Trincado ou quebrado','Não sei'] :
  index === 11 ? ['Funcionando','Opaco','Quebrado ou sem funcionar','Não sei'] :
  index < 5 ? ['Sem avarias','Arranhado','Amassado ou quebrado','Não sei'] : ['Ótimo','Bom','Ruim','Não sei'];
const fields = ['owner','phone','city','plate','model','year','km'];
function encode(file) {
  return new Promise((resolve,reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve({name:file.name,data:reader.result});
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });

function decode(media,kind,limit) {
  const match = typeof media?.data === 'string' && media.data.match(/^data:([a-z]+\/[a-z0-9.+-]+);base64,([a-z0-9+/=]+)$/i);
  if (!match || !match[1].startsWith(kind+'/')) throw Error('Mídia inválida');
  const bytes = Uint8Array.from(atob(match[2]),char => char.charCodeAt(0));
  if (!bytes.length || bytes.length > limit*1024**2) throw Error('Tamanho inválido');
  return new File([bytes],String(media.name || kind),{type:match[1]});
}
async function importAssessment(file) {
  if (file.size > 46*1024**2) throw Error('Tamanho inválido');
  const report = JSON.parse(await file.text());
  if (!report || report.version !== 1 || !/^[a-f0-9-]{36}$/i.test(report.id) ||
      !fields.every(key => typeof report[key] === 'string' && report[key].trim() && report[key].length <= 120) ||
      !/^[a-z]{3}[0-9][a-z0-9][0-9]{2}$/i.test(report.plate) ||
      !Number.isInteger(Number(report.year)) || Number(report.year)<1886 || Number(report.year)>2100 ||
      !Number.isSafeInteger(Number(report.km)) || Number(report.km)<0 ||
      !Array.isArray(report.answers) || ![10,checks.length].includes(report.answers.length) ||
      !report.answers.every(value => Number.isInteger(value) && value >= 0 && value <= 3)) throw Error('Ficha inválida');
  const id = 'pre-'+report.id;
  const vehicle = Object.fromEntries(fields.map(key => [key,report[key]]));
  Object.assign(vehicle,{id,created:Date.now(),answers:report.answers,photo:decode(report.photo,'image',8),video:decode(report.video,'video',25)});
  const db = await database;
  await new Promise((resolve,reject) => {
    const transaction = db.transaction('vehicles','readwrite');
    transaction.oncomplete = resolve;
    transaction.onabort = () => reject(transaction.error);
    transaction.objectStore('vehicles').add(vehicle);
  });
  vehicles = await readVehicles();
}

function repairRows(answers) {
  return answers.map((answer,index) => {
    const [name,minor,major] = checks[index];
    const center = [0,minor,major,0][answer];
    const painting = index < 5 && answer === 1;
    return {name,condition:options(index)[answer],pending:answer === 3,
      low:painting ? 500 : Math.floor(center*.75/50)*50,
      high:painting ? (index === 4 ? 1000 : 500) : Math.ceil(center*1.25/50)*50};
  });
}
function repairRange(low,high) {
  return low === high ? money.format(low) : money.format(low)+' a '+money.format(high);
}
function downloadFile(blob,name) {
  const url = URL.createObjectURL(blob);
  const link = element('a');
  link.href = url;
  link.download = name;
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url),30000);
}
async function repairReport(report) {
  try {
    downloadFile(await repairPdf(report),'avalia-top-estimativa-reparos.pdf');
  } catch {
    notice('Não foi possível gerar o PDF.');
  }
}
async function repairPdf(report) {
  const hex = value => Array.from(String(value),char => {
    const point = char === '\u00a0' ? 32 : char.codePointAt(0);
    return (point >= 32 && point <= 255 ? point : 63).toString(16).padStart(2,'0');
  }).join('');
  const text = (value,x,y,size = 11) =>
    'BT /F1 '+size+' Tf '+x+' '+y+' Td <'+hex(value)+'> Tj ET\n';
  const rows = repairRows(report.answers);
  const low = rows.reduce((sum,row) => sum+row.low,0);
  const high = rows.reduce((sum,row) => sum+row.high,0);
  let stream = '0.62 0.06 0.13 rg 36 738 523 66 re f\n1 1 1 rg\n';
  stream += text('AVALIA TOP',52,774,19)+text('Estimativa de reparos',52,751,13);
  stream += '0.07 0.17 0.14 rg\n';
  const model = Array.from(report.model || '');
  stream += text(model.slice(0,72).join(''),36,710);
  stream += text(model.slice(72).join(''),36,695);
  stream += text([report.code,report.year,report.plate,number.format(report.km)+' km'].filter(Boolean).join(' | '),36,676);
  rows.forEach((row,index) => {
    const y = 576-index*23;
    stream += text(row.name,36,y,10)+text(row.condition,220,y,10)
      +text(row.pending ? 'Conferir' : repairRange(row.low,row.high),393,y,10);
  });
  stream += '0.99 0.91 0.92 rg 36 600 523 61 re f\n0.07 0.17 0.14 rg\n';
  stream += text('TOTAL ESTIMADO',48,644,11);
  stream += text(repairRange(low,high),48,617,21);
  stream += text('Média: '+money.format((low+high)/2),365,618,11);
  const bottom = 576-rows.length*23-12;
  stream += text('Valores indicativos. Itens a conferir ficam fora do total.',36,bottom-46,10);
  stream += text('O custo final depende da inspeção e do orçamento da oficina.',36,bottom-62,10);
  const objects = [
    '<< /Type /Catalog /Pages 2 0 R >>',
    '<< /Type /Pages /Count 1 /Kids [3 0 R] >>',
    '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 4 0 R >> >> /Contents 5 0 R >>',
    '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>',
    '<< /Length '+stream.length+' >>\nstream\n'+stream+'endstream'
  ];
  let pdf = '%PDF-1.4\n';
  const offsets = objects.map((object,index) => {
    const offset = pdf.length;
    pdf += (index+1)+' 0 obj\n'+object+'\nendobj\n';
    return offset;
  });
  const xref = pdf.length;
  pdf += 'xref\n0 '+(objects.length+1)+'\n0000000000 65535 f \n';
  offsets.forEach(offset => { pdf += String(offset).padStart(10,'0')+' 00000 n \n'; });
  pdf += 'trailer\n<< /Size '+(objects.length+1)+' /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF\n';
  return new Blob([pdf],{type:'application/pdf'});
}

function showAssessment(vehicle,container) {

const sample = [
  {id:'demo-1',model:'Chevrolet Onix Plus',trim:'LTZ Turbo',year:2023,km:42100,value:74500,evaluated:Date.now()-86400000},

const database = new Promise((resolve,reject) => {
  const request = indexedDB.open('consigna',1);
  request.onupgradeneeded = () => {
    const store = request.result.createObjectStore('vehicles',{keyPath:'id'});
    sample.forEach(vehicle => store.add(vehicle));
  };
  request.onsuccess = () => resolve(request.result);
  request.onerror = () => reject(request.error);
});
let vehicles = [], page = 'home', mediaUrls = [], dialogUrls = [];
const master = () => $('#role').value === 'master';
function element(tag, value, className) {
  const node = document.createElement(tag);
  if (value !== undefined) node.textContent = value;
  if (className) node.className = className;
  return node;
}
function button(label, action, style) {
  const node = element('button',label,style);
  node.type = 'button';
  node.onclick = action;
  return node;
}
async function readVehicles() {
  const db = await database;
  return new Promise((resolve,reject) => {
    const request = db.transaction('vehicles').objectStore('vehicles').getAll();
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}
async function save(vehicle,finalValue) {
  const db = await database;
  await new Promise((resolve,reject) => {
    const transaction = db.transaction('vehicles','readwrite');
    transaction.oncomplete = resolve;
    transaction.onabort = () => reject(transaction.error);
    const store = transaction.objectStore('vehicles');
    if (finalValue === undefined) {
      store.put(vehicle);
      return;
    }
    const request = store.getAll();
    request.onsuccess = () => {
      const current = request.result.find(item => item.id === vehicle.id);
      if (!current?.answers?.length || current.evaluated) {
        transaction.abort();
        return;
      }
      const last = request.result.reduce((max,item) => Math.max(max,Number(item.code?.match(/^COD(\d+)$/)?.[1] || 0)),0);
      const code = 'COD'+String(last+1).padStart(4,'0');
      store.put({...current,code,value:finalValue,evaluated:Date.now()});
    };
  });
  vehicles = await readVehicles();
}

  if (!list.length) container.append(element('p','Nenhum veículo encontrado.','empty'));
  list.forEach(vehicle => {
    const card = element('article',undefined,'card');
    card.append(photo(vehicle,mediaUrls),element('h2',vehicle.model),element('p',description(vehicle)));
    if (vehicle.evaluated) {
      card.append(element('p',money.format(vehicle.value),'price'),element('p','Avaliado em '+date.format(vehicle.evaluated)));
    } else {
      card.append(element('p','Aguardando avaliação','badge'));
    }
    if (page === 'feed' && vehicle.photo) {
      const download = element('a','Baixar foto','download-photo');
      download.href = card.querySelector('img').src;
      download.download = vehicle.photo.name || 'foto-do-veiculo';
      download.setAttribute('aria-label','Baixar foto de '+vehicle.model);
      card.append(download);
    }
    if (vehicle.code) card.append(element('p',vehicle.code,'badge'));
    if (vehicle.unavailable) card.append(element('p','Indisponível','badge'));
    if (vehicle.evaluated || vehicle.answers?.length) {
      card.append(button(vehicle.evaluated ? 'Ver detalhes' : 'Avaliar veículo',() => details(vehicle)));
    } else {
      const link = element('a','Preencher pré-avaliação','download-photo');
      link.href = '?pre-avaliacao';
      card.append(link);
    }
    container.append(card);
  });
}

    copy.append($('h1'),$('#intro'),start);
    hero.append(copy,image);
    content.append(hero);
    return;
  }
  if (page === 'register') {
    const actions = element('div');
    actions.style.cssText = 'display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px';
    const link = element('a','Abrir formulário de pré-avaliação');
    Object.assign(link,{href:'?pre-avaliacao',target:'_blank',rel:'noopener'});
    const copy = button('Copiar link',async () => {
      try {
        await navigator.clipboard.writeText(link.href);
        notice('Link da pré-avaliação copiado.');
      } catch {
        window.prompt('Copie o link da pré-avaliação:',link.href);
      }
    },'');
    link.className = 'download-photo';
    actions.append(link,copy);
    content.append(actions);
    return;
  }
  const list = vehicles.filter(vehicle => {
    if (page === 'pending') return !vehicle.evaluated;
    if (page === 'unavailable') return master() && vehicle.evaluated && vehicle.unavailable;
    return vehicle.evaluated && !vehicle.unavailable;
  })
    .sort((a,b) => (b.evaluated || b.created || 0)-(a.evaluated || a.created || 0));
  if (page === 'pending' && master()) {
    const intake = element('div',undefined,'intake');
    const label = element('label','Importar ficha do cliente');
    const file = element('input');
    Object.assign(file,{type:'file',accept:'.json,application/json'});
    file.onchange = async () => {
      if (!master() || !file.files[0]) return;
      file.disabled = true;
      try {
        await importAssessment(file.files[0]);
        render();
        notice('Pré-avaliação importada para Pendentes.');
      } catch (error) {
        notice(error?.name === 'ConstraintError' ? 'Esta ficha já foi importada.' : 'Não foi possível importar. Confira o arquivo recebido.');
        file.value = '';
        file.disabled = false;
      }
    };
    label.append(file);
    intake.append(label);
    content.append(intake);
  }
  const grid = element('div',undefined,'grid');
  if (page === 'feed') {
    const search = element('input');
    Object.assign(search,{id:'search',type:'search',placeholder:'Buscar por código, modelo, versão ou ano'});
    search.setAttribute('aria-label','Buscar veículos avaliados');
    search.oninput = () => {
      const normalize = value => value.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
      const query = normalize(search.value.trim());
      cards(grid,list.filter(vehicle => normalize([vehicle.code,vehicle.model,vehicle.trim,vehicle.year].join(' ')).includes(query)));
    };
    content.append(search);
  }
  content.append(grid);
  cards(grid,list);
}

$('dialog').addEventListener('close',() => release(dialogUrls));
$('#role').onchange = () => {
  $('dialog').close();
  show($('#role').value === 'home' ? 'home' : 'feed');
};
if (new URLSearchParams(location.search).has("pre-avaliacao")) customerForm();
else readVehicles().then(result => { vehicles = result; render(); }).catch(() => notice('O armazenamento local está indisponível.'));
</script></body></html>
