<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Consigna</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f2;color:#172622;font:16px system-ui,sans-serif}header{background:#132b24;color:#fff;padding:18px max(5vw,20px);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}header strong{font-size:27px;letter-spacing:-1px}main{max-width:1120px;margin:auto;padding:36px 20px}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:28px}button,select,input{font:inherit;border-radius:9px;padding:10px;border:1px solid #cbd5ce}button{cursor:pointer;background:#fff;color:#172622}button.primary,button[aria-current=true]{background:#166348;color:#fff;border-color:#166348}h1{font-size:clamp(30px,5vw,46px);letter-spacing:-.055em;margin:0}p{line-height:1.5;color:#52635b}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:16px}.card,form,.empty{background:white;border:1px solid #dce5de;border-radius:16px;padding:18px}article h2{margin:10px 0 0;font-size:21px}.media{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:9px;background:#e7eee8;display:grid;place-items:center;color:#51665a}.price{font-size:22px;font-weight:750;color:#166348}.badge{font-size:13px;padding:4px 9px;background:#f4ead1;border-radius:20px}label{display:grid;gap:6px;font-size:14px;font-weight:600}input{width:100%;min-width:0}form button{margin-top:12px}dialog{width:min(560px,94vw);border:1px solid #dce5de;border-radius:16px;padding:20px;max-height:90vh}dialog::backdrop{background:#142b2499}#status{min-height:1.5em}a{color:#166348}video{width:100%;margin-top:12px}#search{max-width:380px;margin-bottom:16px}

:root{--ink:#132b24;--green:#166348;--line:#dce5de}
body{min-width:0}
header{padding-block:12px;padding-top:max(12px,env(safe-area-inset-top));gap:8px}
header label{display:flex;align-items:center;gap:8px;color:#d7e9df;font-size:13px}
header select{max-width:100%;color:var(--ink);background:#fff}
button,select,input{min-height:44px;font-size:16px}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #2b9d75;outline-offset:3px}
button:disabled{opacity:.6;cursor:wait}
#status:empty{display:none}
#status:not(:empty){background:#e3eee6;padding:12px;border-radius:10px}
#search{max-width:none;background:white;padding-inline:14px}
.card{display:flex;flex-direction:column;gap:8px;overflow-wrap:anywhere}
.card h2,.card p{margin:0}
.card h2{margin-top:4px}
.card button{margin-top:auto;align-self:stretch}
.card .badge{align-self:flex-start}
form label{min-width:0}
input[type=file]{background:#f5f8f5;padding:6px}
input::file-selector-button{border:0;border-radius:6px;padding:8px;background:#e3eee6;color:var(--ink);font:inherit}
dialog{max-height:calc(100dvh - 32px);overflow:auto;color:var(--ink)}
dialog h2{margin-top:0;overflow-wrap:anywhere}
dialog video{max-height:45dvh;background:var(--ink);border-radius:9px}
@media(max-width:640px){
  header{padding-inline:max(16px,env(safe-area-inset-left)) max(16px,env(safe-area-inset-right))}
  header strong{font-size:24px}
  header label{gap:5px}
  header select{max-width:150px;padding:6px}
  main{padding:24px max(16px,env(safe-area-inset-right)) 24px max(16px,env(safe-area-inset-left))}
  body[data-profile=master] main{padding-bottom:calc(88px + env(safe-area-inset-bottom))}
  nav{display:none}
  body[data-profile=master] nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));position:fixed;inset:auto 0 0;z-index:1;margin:0;padding:8px max(12px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));background:white;border-top:1px solid var(--line);box-shadow:0 -6px 24px #132b2410}
  nav button{min-width:0;min-height:48px;padding:6px;font-size:14px;font-weight:650}
  h1{font-size:34px;line-height:1.06}
  #intro{margin:10px 0 20px}
  .grid{grid-template-columns:minmax(0,1fr);gap:12px}
  .card,form{padding:14px}
  .card .media{aspect-ratio:16/8}
  form button{width:100%}
  #register .grid{gap:16px}
  dialog{width:100%;max-width:none;margin:auto 0 0;border-radius:20px 20px 0 0;padding:20px max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));max-height:calc(100dvh - max(12px,env(safe-area-inset-top)))}
}
</style>
<body data-profile="viewer"><header><div><strong>Consigna</strong></div><label>Perfil<select id="role"><option value="viewer">Visualizador</option><option value="master">Usuário mestre</option></select></label></header>
<main><nav aria-label="Áreas"></nav><h1></h1><p id="intro"></p><p id="status" role="status"></p><section id="content"></section></main>
<dialog aria-label="Detalhes do veículo"><div id="detail"></div><form method="dialog" style="padding:0;border:0"><button>Fechar</button></form></dialog>
<template id="registration"><form id="register"><div class="grid">
<label>Nome do proprietário<input name="owner" autocomplete="name" required maxlength="120"></label>
<label>WhatsApp<input name="phone" type="tel" autocomplete="tel" required maxlength="22" placeholder="(65) 99999-0000"></label>
<label>Marca e modelo<input name="model" required maxlength="100" placeholder="Chevrolet Onix Plus"></label>
<label>Versão<input name="trim" maxlength="100" placeholder="LTZ Turbo"></label>
<label>Ano-modelo<input name="year" type="number" inputmode="numeric" min="1886" max="2100" required></label>
<label>Quilometragem<input name="km" type="number" inputmode="numeric" min="0" required></label>
<label>Foto<input name="photo" type="file" accept="image/*"></label>
<label>Vídeo<input name="video" type="file" accept="video/*"></label>
</div><button class="primary">Cadastrar veículo</button></form></template>
<script>
const $ = selector => document.querySelector(selector);
const money = new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const number = new Intl.NumberFormat('pt-BR');
const date = new Intl.DateTimeFormat('pt-BR',{dateStyle:'medium'});
const sample = [
  {id:'demo-1',model:'Chevrolet Onix Plus',trim:'LTZ Turbo',year:2023,km:42100,value:74500,evaluated:Date.now()-86400000},
  {id:'demo-2',model:'Ford EcoSport',trim:'Titanium 1.6',year:2013,km:119000,value:38900,evaluated:Date.now()-172800000},
  {id:'demo-3',model:'Chevrolet Spin',trim:'LTZ 1.8 automática',year:2013,km:134000}
];
const database = new Promise((resolve,reject) => {
  const request = indexedDB.open('consigna',1);
  request.onupgradeneeded = () => {
    const store = request.result.createObjectStore('vehicles',{keyPath:'id'});
    sample.forEach(vehicle => store.add(vehicle));
  };
  request.onsuccess = () => resolve(request.result);
  request.onerror = () => reject(request.error);
});
let vehicles = [], page = 'feed', mediaUrls = [], dialogUrls = [];
const master = () => $('#role').value === 'master';
function element(tag, value, className) {
  const node = document.createElement(tag);
  if (value !== undefined) node.textContent = value;
  if (className) node.className = className;
  return node;
}
function button(label, action, style) {
  const node = element('button',label,style);
  node.type = 'button';
  node.onclick = action;
  return node;
}
async function readVehicles() {
  const db = await database;
  return new Promise((resolve,reject) => {
    const request = db.transaction('vehicles').objectStore('vehicles').getAll();
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}
async function save(vehicle) {
  const db = await database;
  await new Promise((resolve,reject) => {
    const transaction = db.transaction('vehicles','readwrite');
    transaction.oncomplete = resolve;
    transaction.onabort = () => reject(transaction.error);
    transaction.objectStore('vehicles').put(vehicle);
  });
  vehicles = await readVehicles();
}
function notice(message) { $('#status').textContent = message; }
function media(blob, urls) {
  const url = URL.createObjectURL(blob);
  urls.push(url);
  return url;
}
function release(urls) { urls.splice(0).forEach(url => URL.revokeObjectURL(url)); }
function show(next) {
  page = next;
  notice('');
  render();
}
function photo(vehicle, urls) {
  if (!vehicle.photo) return element('div','Sem foto','media');
  const image = element('img',undefined,'media');
  image.src = media(vehicle.photo,urls);
  image.alt = vehicle.model;
  return image;
}
function description(vehicle) {
  return [vehicle.trim,vehicle.year,number.format(vehicle.km)+' km'].filter(Boolean).join(' · ');
}
function details(vehicle) {
  const container = $('#detail');
  container.replaceChildren(element('h2',vehicle.model),element('p',description(vehicle)));
  container.append(photo(vehicle,dialogUrls));
  if (vehicle.evaluated) container.append(element('p',money.format(vehicle.value),'price'));
  if (master() && vehicle.owner) {
    container.append(element('p','Proprietário · '+vehicle.owner),element('p','WhatsApp · '+vehicle.phone));
  }
  if (vehicle.video) {
    const video = element('video');
    video.controls = true;
    video.playsInline = true;
    video.preload = 'metadata';
    video.src = media(vehicle.video,dialogUrls);
    container.append(video);
  }
  if (master() && !vehicle.evaluated) {
    const form = element('form');
    const label = element('label','Valor da avaliação em reais');
    const input = element('input');
    Object.assign(input,{type:'number',min:'0.01',step:'0.01',inputMode:'decimal',required:true});
    label.append(input);
    const submit = element('button','Salvar avaliação e publicar no feed','primary');
    const feedback = element('p');
    feedback.setAttribute('role','status');
    form.append(label,submit,feedback);
    form.onsubmit = async event => {
      event.preventDefault();
      if (!master()) return;
      submit.disabled = true;
      try {
        await save({...vehicle,value:input.valueAsNumber,evaluated:Date.now()});
        $('dialog').close();
        show('feed');
        notice('Avaliação publicada no feed.');
      } catch {
        feedback.textContent = 'Não foi possível salvar a avaliação. Tente novamente.';
        submit.disabled = false;
      }
    };
    container.append(form);
  }
  $('dialog').showModal();
}
function cards(container, list) {
  release(mediaUrls);
  container.replaceChildren();
  if (!list.length) container.append(element('p','Nenhum veículo encontrado.','empty'));
  list.forEach(vehicle => {
    const card = element('article',undefined,'card');
    card.append(photo(vehicle,mediaUrls),element('h2',vehicle.model),element('p',description(vehicle)));
    if (vehicle.evaluated) {
      card.append(element('p',money.format(vehicle.value),'price'),element('p','Avaliado em '+date.format(vehicle.evaluated)));
    } else {
      card.append(element('p','Aguardando avaliação','badge'));
    }
    card.append(button(vehicle.evaluated ? 'Ver detalhes' : 'Avaliar veículo',() => details(vehicle)));
    container.append(card);
  });
}
const pages = {
  feed:['Feed de avaliações','Consulte os veículos avaliados para consignação.'],
  pending:['Pendentes de avaliação','Registre o valor para publicar o veículo no feed.'],
  register:['Cadastrar veículo','Preencha os dados do proprietário e do veículo.']
};
const navigationLabels = {feed:'Feed',pending:'Pendentes',register:'Cadastrar'};
function render() {
  document.body.dataset.profile = master() ? 'master' : 'viewer';
  release(mediaUrls);
  $('nav').replaceChildren();
  Object.entries(pages).filter(([id]) => master() || id === 'feed').forEach(([id]) => {
    const item = button(navigationLabels[id],() => {
      show(id);
      window.scrollTo(0,0);
    });
    if (id === page) item.setAttribute('aria-current','true');
    $('nav').append(item);
  });
  const [title,intro] = pages[page];
  $('h1').textContent = title;
  $('#intro').textContent = intro;
  const content = $('#content');
  content.replaceChildren();
  if (page === 'register') {
    content.append($('#registration').content.cloneNode(true));
    $('#register').onsubmit = register;
    return;
  }
  const list = vehicles.filter(vehicle => page === 'feed' ? vehicle.evaluated : !vehicle.evaluated)
    .sort((a,b) => (b.evaluated || b.created || 0)-(a.evaluated || a.created || 0));
  const grid = element('div',undefined,'grid');
  if (page === 'feed') {
    const search = element('input');
    Object.assign(search,{id:'search',type:'search',placeholder:'Buscar por modelo, versão ou ano'});
    search.setAttribute('aria-label','Buscar veículos avaliados');
    search.oninput = () => {
      const normalize = value => value.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
      const query = normalize(search.value.trim());
      cards(grid,list.filter(vehicle => normalize([vehicle.model,vehicle.trim,vehicle.year].join(' ')).includes(query)));
    };
    content.append(search);
  }
  content.append(grid);
  cards(grid,list);
}
async function register(event) {
  event.preventDefault();
  if (!master()) return;
  const form = event.currentTarget;
  const data = Object.fromEntries(new FormData(form));
  for (const field of ['owner','phone','model','trim']) data[field] = data[field].trim();
  if (!data.owner || !data.model || data.phone.replace(/\D/g,'').length < 10) {
    notice('Confira o nome, o modelo e o número de WhatsApp.');
    return;
  }
  const submit = form.querySelector('button');
  submit.disabled = true;
  try {
    await save({...data,id:crypto.randomUUID(),created:Date.now(),photo:data.photo.size ? data.photo : null,video:data.video.size ? data.video : null});
    if (master()) show('pending');
    notice('Veículo cadastrado e aguardando avaliação.');
  } catch {
    notice('Não foi possível salvar o cadastro. Confira o espaço disponível e tente novamente.');
    submit.disabled = false;
  }
}
$('dialog').addEventListener('close',() => release(dialogUrls));
$('#role').onchange = () => {
  $('dialog').close();
  show('feed');
};
readVehicles().then(result => { vehicles = result; render(); }).catch(() => notice('O armazenamento local está indisponível.'));
</script></body></html>
