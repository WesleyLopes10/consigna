  body[data-profile=master] nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));position:fixed;inset:auto 0 0;z-index:1;margin:0;padding:8px max(12px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));background:white;border-top:1px solid var(--line);box-shadow:0 -6px 24px #132b2410}

  dialog{width:100%;max-width:none;margin:auto 0 0;border-radius:20px 20px 0 0;padding:20px max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));max-height:calc(100dvh - max(12px,env(safe-area-inset-top)))}
}
.download-photo{display:grid;place-items:center;min-height:44px;padding:8px;border:1px solid #cbd5ce;border-radius:9px;text-decoration:none;font-weight:600}
.download-photo:focus-visible{outline:3px solid #2b9d75;outline-offset:3px}

nav button[data-section]{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;background:var(--tab-bg);color:var(--tab-ink);font-weight:650;transition:background-color .15s,color .15s,transform .15s}
nav button[data-section=feed]{--tab-bg:#e2f3e9;--tab-ink:#15563e}
nav button[data-section=pending]{--tab-bg:#fff0d4;--tab-ink:#795000}

nav button[data-section]:active{transform:scale(.97)}
@media(max-width:640px){
  nav button[data-section]{flex-direction:column;gap:3px;min-height:56px;padding:4px;font-size:12px}

#pre-form{max-width:660px}#pre-form fieldset{min-width:0;border:0;padding:0}#pre-form legend{font-size:20px;font-weight:700;margin-bottom:16px}#pre-form label{margin-bottom:12px}#pre-form select{width:100%}.intake{display:grid;gap:12px;background:white;padding:16px;border:1px solid #dce5de;border-radius:14px;margin-bottom:16px}

.customer-app main{max-width:700px}
.customer-app h1{font-size:clamp(30px,6vw,44px);line-height:1.08}
.customer-app #intro{margin-bottom:20px}
#pre-form{max-width:none;padding:clamp(14px,4vw,28px);border-radius:20px}
.pre-progress{margin:0 0 10px;font-size:14px;font-weight:700;color:#166348}
.pre-steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;list-style:none;padding:0;margin:0 0 24px}
.pre-steps li{background:#f2f5f2;color:#52635b;border-radius:10px;padding:10px 4px;text-align:center;font-size:14px;font-weight:650}
.pre-steps li.complete{background:#e2f3e9;color:#15563e}
.pre-steps li[aria-current=step]{background:#166348;color:white}
#pre-form input:not([type=radio]){background:#f7faf7;border-radius:10px;padding:10px 12px}
#pre-count{margin:0 0 16px;font-size:14px}
#pre-checks{display:grid;gap:14px}
#pre-form .pre-question{background:#f6f8f6;border:1px solid #dce5de;border-radius:12px;padding:10px;margin:0}

.pre-choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}

.pre-choice input{position:absolute;width:1px;height:1px;min-height:0;opacity:0}
.pre-choice span{display:grid;place-items:center;min-height:48px;padding:7px;text-align:center;background:white;color:#172622;border:2px solid #dce5de;border-radius:9px;cursor:pointer}
.pre-choice[data-tone=good]{--choice-color:#15563e;--choice-bg:#e2f3e9}
.pre-choice[data-tone=medium]{--choice-color:#795000;--choice-bg:#fff0d4}
.pre-choice[data-tone=bad]{--choice-color:#932e33;--choice-bg:#ffe9e9}
.pre-choice[data-tone=unknown]{--choice-color:#48566c;--choice-bg:#e9eef5}
.pre-choice input:checked+span{background:var(--choice-bg);border-color:var(--choice-color);color:var(--choice-color)}
.pre-choice input:focus-visible+span{outline:3px solid #2b9d75;outline-offset:2px}
.pre-actions{display:flex;gap:8px;margin-top:18px}
.pre-actions button{margin:0;width:auto;min-height:48px}
.pre-actions .primary{flex:1}

.pre-diagram{display:grid;place-items:center;background:#e5f2e9;border-radius:9px;margin-bottom:8px}
.pre-diagram svg{display:block;width:min(100%,220px);height:100px}
.pre-diagram svg :is(path,rect,circle):last-child:not([fill]){fill:#8cc9a7;stroke:#166348}
.pre-diagram[data-part="2"] svg rect,.pre-diagram[data-part="3"] svg rect:first-of-type,.pre-diagram[data-part="4"] svg path:nth-last-child(2){fill:#f2cc83;stroke:#795000}
.pre-diagram[data-part="5"] svg circle:first-child{fill:#8cc9a7;stroke:#166348}
.pre-diagram[data-part="6"] svg path:last-child{stroke:#166348;stroke-width:4}
.pre-diagram-caption{font-size:13px;margin:0 0 10px}
.pre-section{display:grid;gap:12px}
.pre-section+.pre-section{margin-top:12px}
.pre-section h3{margin:0;padding:10px 12px;border-radius:9px;background:#e2f3e9;color:#15563e;font-size:16px}
</style>
<body data-profile="viewer"><header><div><strong>Consigna</strong></div><label>Perfil<select id="role"><option value="viewer">Visualizador</option><option value="master">Usuário mestre</option></select></label></header>
<main><nav aria-label="Áreas"></nav><h1></h1><p id="intro"></p><p id="status" role="status"></p><section id="content"></section></main>
<dialog aria-label="Detalhes do veículo"><div id="detail"></div><form method="dialog" style="padding:0;border:0"><button>Fechar</button></form></dialog>
<template id="registration"><form id="register"><div class="grid">
<label>Nome do proprietário<input name="owner" autocomplete="name" required maxlength="120"></label>
<label>WhatsApp<input name="phone" type="tel" autocomplete="tel" required maxlength="22" placeholder="(65) 99999-0000"></label>
<label>Marca e modelo<input name="model" required maxlength="100" placeholder="Chevrolet Onix Plus"></label>
<label>Versão<input name="trim" maxlength="100" placeholder="LTZ Turbo"></label>
<label>Ano-modelo<input name="year" type="number" inputmode="numeric" min="1886" max="2100" required></label>
<label>Quilometragem<input name="km" type="number" inputmode="numeric" min="0" required></label>
<label>Foto<input name="photo" type="file" accept="image/*"></label>
<label>Vídeo<input name="video" type="file" accept="video/*"></label>
</div><button class="primary">Cadastrar veículo</button></form></template>
<template id="pre-template"><form id="pre-form">
<p id="pre-progress" class="pre-progress" aria-live="polite"></p>
<ol class="pre-steps" aria-label="Etapas"><li>Seus dados</li><li>Veículo</li><li>Checklist</li></ol>
<fieldset><legend>Dados pessoais</legend>
<label>Nome<input name="owner" autocomplete="name" maxlength="120" required></label>
<label>Telefone / WhatsApp<input name="phone" type="tel" autocomplete="tel" minlength="10" maxlength="22" required></label>
<label>Cidade<input name="city" autocomplete="address-level2" maxlength="100" required></label></fieldset>
<fieldset hidden disabled><legend>Carro, foto e vídeo</legend>
<label>Placa<input name="plate" maxlength="7" pattern="[A-Za-z]{3}[0-9][A-Za-z0-9][0-9]{2}" placeholder="ABC1D23" autocapitalize="characters" required></label>
<label>Marca e modelo<input name="model" maxlength="100" required></label>
<label>Ano-modelo<input name="year" type="number" min="1886" max="2100" required></label>
<label>Quilometragem<input name="km" type="number" min="0" required></label>
<label>Foto do veículo (até 8 MB)<input name="photo" type="file" accept="image/*" required></label>
<label>Vídeo do veículo (até 25 MB)<input name="video" type="file" accept="video/*" required></label></fieldset>
<fieldset hidden disabled><legend>Estado do veículo</legend><p id="pre-count" aria-live="polite"></p><div id="pre-checks"></div></fieldset>
<div class="pre-actions"><button id="pre-back" type="button" hidden>Voltar</button>
<button id="pre-next" class="primary">Continuar</button></div></form></template>
<script>
const $ = selector => document.querySelector(selector);
const money = new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const number = new Intl.NumberFormat('pt-BR');
const date = new Intl.DateTimeFormat('pt-BR',{dateStyle:'medium'});

const checks = [
 ['Porta esquerda',250,700],['Porta direita',250,700],['Para-choque dianteiro',250,650],
 ['Para-choque traseiro',250,650],['Capô e teto',350,1000],['Pneus',400,1200],
 ['Suspensão',450,1400],['Freios',350,950],['Motor',650,2200],['Câmbio',650,2200],
 ['Para-brisa',350,1200],['Faróis',250,850],['Ar-condicionado',400,1400],
 ['Bancos e estofamento',250,750],['Painel e comandos',300,1000],['Vidros e travas elétricas',250,800]
];
const checkSections = [
  ['Estrutura e exterior',[0,1,2,3,4,10,11]],
  ['Interior e conforto',[12,13,14,15]],
  ['Motor e câmbio',[8,9]],
  ['Suspensão, pneus e freios',[6,5,7]]
];
const options = index => index === 10 ? ['Sem avarias','Riscado ou lascado','Trincado ou quebrado','Não sei'] :
  index === 11 ? ['Funcionando','Opaco','Quebrado ou sem funcionar','Não sei'] :
  index < 5 ? ['Sem avarias','Arranhado','Amassado ou quebrado','Não sei'] : ['Ótimo','Bom','Ruim','Não sei'];
const fields = ['owner','phone','city','plate','model','year','km'];
function encode(file) {
  return new Promise((resolve,reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve({name:file.name,data:reader.result});
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function inspectionDiagram(index) {
  const side = '<path d="M29 65 39 48 69 43 87 25H137L158 45 179 51 186 65V80H25V72Z"/><path d="M72 45 90 30H134L149 45Z"/><circle cx="57" cy="80" r="13"/><circle cx="155" cy="80" r="13"/>';
  const ends = '<path d="M42 73V54L56 28H154L168 54V73Z"/><path d="M54 51 64 33H146L156 51Z"/><path d="M48 61H72M138 61H162M53 77V84M157 77V84"/>';
  const door = index === 1 ? '<path d="M117 49H149L139 73H117Z"/>' : '<path d="M80 49H113V73H76Z"/>';
  const diagrams = [
    side+door,
    '<g transform="translate(210) scale(-1 1)">'+side+'<path d="M80 49H113V73H76Z"/></g>',
    ends+'<rect x="42" y="67" width="126" height="10" rx="4"/>',
    ends+'<rect x="42" y="67" width="126" height="10" rx="4"/><rect x="92" y="55" width="26" height="8" rx="2" fill="#f5faf7"/>',
    side+'<path d="M35 53 67 47 70 57H33Z"/><path d="M87 25H137L145 32H82Z"/>',
    '<circle cx="105" cy="55" r="36"/><circle cx="105" cy="55" r="27"/><circle cx="105" cy="55" r="15" fill="#f5faf7"/><path d="M105 44V66M94 55H116" fill="none"/>',
    '<circle cx="76" cy="67" r="24"/><path d="M76 67H115L137 25M119 19H150"/><path d="m123 32 16 5-22 4 16 6-22 4 16 6-19 4" fill="none"/>',
    '<circle cx="102" cy="54" r="36"/><circle cx="102" cy="54" r="13"/><path d="M102 25v6m-21 4 4 4m-12 15h6m2 19 4-4m17 14v-6"/><rect x="122" y="38" width="23" height="32" rx="6"/>',
    '<path d="M53 51h17l13-15h44l13 15h16v29h-20l-10 9H79l-9-11H53Z"/><path d="M91 36V23h24v13M45 55v20m120-22v20"/><path d="M81 55h44v19H81Z"/>',
    '<path d="M70 28h70l14 19v38H56V47Z"/><path d="M84 43v28m21-28v28m21-28v28M84 56h42"/><circle cx="126" cy="43" r="6"/>',
    '<path d="M42 76V55l14-27h98l14 27v21Z"/><path d="M53 63h20m64 0h20"/><path d="M57 53 65 34h80l8 19Z"/>',
    '<path d="M42 76V55l14-27h98l14 27v21Z"/><path d="M57 53 65 34h80l8 19Z"/><rect x="49" y="59" width="27" height="10" rx="4" fill="#f2cc83"/><rect x="134" y="59" width="27" height="10" rx="4" fill="#f2cc83"/>',
    '<rect x="50" y="27" width="110" height="31" rx="7"/><path d="M62 37h86M62 47h86"/><path d="M78 67q-8 8 0 16m27-16q-8 8 0 16m27-16q-8 8 0 16" fill="none" stroke="#166348"/>',
    '<path d="M56 76h98m-79 0v10m64-10v10"/><rect x="68" y="18" width="31" height="19" rx="6"/><path d="M67 68 60 43q0-7 8-7h29q7 0 10 9l8 16h29q10 0 10 10v5H67Z"/>',
    '<path d="M39 73V55q66-56 132 0v18Z"/><circle cx="76" cy="55" r="14"/><path d="m76 55 6-7m35 7h33m-33 8h22"/><rect x="104" y="42" width="51" height="28" rx="5"/>',
    '<path d="M49 84V48l31-23h75v59Z"/><path d="M58 49 83 32h64v17Z"/><path d="M66 63h21"/><rect x="109" y="59" width="32" height="14" rx="4"/>'
  ];
  const illustration = element('div',undefined,'pre-diagram');
  illustration.dataset.part = index;
  illustration.setAttribute('aria-hidden','true');
  illustration.innerHTML = '<svg viewBox="0 0 210 106" fill="none" stroke="#234a3a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">'+diagrams[index]+'</svg>';
  return illustration;
}

function customerForm() {
  document.body.classList.add("customer-app");
  $('header label').remove();
  $('nav').remove();
  $('h1').textContent = 'Pré-avaliação do veículo';
  $('#intro').textContent = 'Preencha a ficha e envie o arquivo baixado à equipe de avaliação.';
  $('#content').append($('#pre-template').content.cloneNode(true));
  const form = $('#pre-form');
  const steps = [...form.querySelectorAll('fieldset')];
  let step = 0;
  const back = $('#pre-back'), next = $('#pre-next');
  function display() {
    steps.forEach((section,index) => section.hidden = section.disabled = index !== step);
    back.hidden = step === 0;
    next.textContent = step === 2 ? 'Baixar ficha para enviar' : 'Continuar';
    $('#pre-progress').textContent = 'Etapa '+(step+1)+' de 3';
    form.querySelectorAll('.pre-steps li').forEach((item,index) => {
      item.classList.toggle('complete',index < step);
      if (index === step) item.setAttribute('aria-current','step');
      else item.removeAttribute('aria-current');
    });
    window.scrollTo(0,0);
  }
  checkSections.forEach(([name,indices]) => {
    const section = element('section',undefined,'pre-section');
    section.append(element('h3',name));
    indices.forEach(index => {
      const [title] = checks[index];
      const group = element('fieldset',undefined,'pre-question');
      const choices = element('div',undefined,'pre-choices');
      group.append(element('legend',title));
      group.append(inspectionDiagram(index));
      if (index < 2) {
        group.append(element('p',index === 0 ? 'Vista de fora, pelo lado esquerdo do carro.' : 'Vista de fora, pelo lado direito do carro.','pre-diagram-caption'));
      }
      group.append(choices);
      options(index).forEach((answer,value) => {
        const label = element('label',undefined,'pre-choice');
        const radio = element('input');
        Object.assign(radio,{type:'radio',required:true,name:'check'+index,value});
        label.dataset.tone = ['good','medium','bad','unknown'][value];
        label.append(radio,element('span',answer));
        choices.append(label);
      });
      section.append(group);
    });
    $('#pre-checks').append(section);
  });
  function updateCount() {
    const count = form.querySelectorAll('.pre-choice input:checked').length;
    $('#pre-count').textContent = count+' de '+checks.length+' itens respondidos';
  }
  $('#pre-checks').onchange = updateCount;
  updateCount();
  back.onclick = () => { notice(''); step--; display(); };
  form.onsubmit = async event => {
    event.preventDefault();
    if (step < 2) { step++; display(); return; }
    steps.forEach(section => section.disabled = false);
    const data = new FormData(form);
    display();
    const photo = data.get('photo'), video = data.get('video');
    if (photo.size > 8*1024**2 || video.size > 25*1024**2) {
      notice('Use uma foto de até 8 MB e um vídeo de até 25 MB.');
      return;
    }
    next.disabled = back.disabled = true;
    try {
      const report = Object.fromEntries(fields.map(key => [key,data.get(key).trim()]));
      Object.assign(report,{version:1,id:crypto.randomUUID(),photo:await encode(photo),video:await encode(video),
        answers:checks.map((_,index) => Number(data.get('check'+index)))});
      const url = URL.createObjectURL(new Blob([JSON.stringify(report)],{type:'application/json'}));
      const link = element('a');
      link.href = url;
      link.download = 'consigna-pre-avaliacao.json';
      document.body.append(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url),30000);
      notice('Ficha pronta. Envie o arquivo baixado à equipe de avaliação.');
    } catch {
      notice('Não foi possível gerar a ficha. Tente novamente.');
    } finally {
      next.disabled = back.disabled = false;
    }
  };
  display();
}
function decode(media,kind,limit) {
  const match = typeof media?.data === 'string' && media.data.match(/^data:([a-z]+\/[a-z0-9.+-]+);base64,([a-z0-9+/=]+)$/i);
  if (!match || !match[1].startsWith(kind+'/')) throw Error('Mídia inválida');
  const bytes = Uint8Array.from(atob(match[2]),char => char.charCodeAt(0));
  if (!bytes.length || bytes.length > limit*1024**2) throw Error('Tamanho inválido');
  return new File([bytes],String(media.name || kind),{type:match[1]});
}
async function importAssessment(file) {
  if (file.size > 46*1024**2) throw Error('Tamanho inválido');
  const report = JSON.parse(await file.text());
  if (!report || report.version !== 1 || !/^[a-f0-9-]{36}$/i.test(report.id) ||
      !fields.every(key => typeof report[key] === 'string' && report[key].trim() && report[key].length <= 120) ||
      !/^[a-z]{3}[0-9][a-z0-9][0-9]{2}$/i.test(report.plate) ||
      !Number.isInteger(Number(report.year)) || Number(report.year)<1886 || Number(report.year)>2100 ||
      !Number.isSafeInteger(Number(report.km)) || Number(report.km)<0 ||
      !Array.isArray(report.answers) || ![10,checks.length].includes(report.answers.length) ||
      !report.answers.every(value => Number.isInteger(value) && value >= 0 && value <= 3)) throw Error('Ficha inválida');
  const id = 'pre-'+report.id;
  const vehicle = Object.fromEntries(fields.map(key => [key,report[key]]));
  Object.assign(vehicle,{id,created:Date.now(),answers:report.answers,photo:decode(report.photo,'image',8),video:decode(report.video,'video',25)});
  const db = await database;
  await new Promise((resolve,reject) => {
    const transaction = db.transaction('vehicles','readwrite');
    transaction.oncomplete = resolve;
    transaction.onabort = () => reject(transaction.error);
    transaction.objectStore('vehicles').add(vehicle);
  });
  vehicles = await readVehicles();
}
function showAssessment(vehicle,container) {
  container.append(element('h3','Pré-avaliação do cliente'),element('p',vehicle.city+' · Placa '+vehicle.plate));
  const list = element('ul');
  let total = 0;
  vehicle.answers.forEach((answer,index) => {
    const [name,minor,major] = checks[index];
    const adjustment = [0,minor,major,0][answer];
    total += adjustment;
    list.append(element('li',name+' · '+options(index)[answer]+' · '+(answer === 3 ? 'Conferir' : money.format(adjustment))));
  });
  const label = element('label','Valor-base definido pela equipe');
  const base = element('input');
  Object.assign(base,{type:'number',min:'0',step:'0.01',inputMode:'decimal'});
  const result = element('p','Informe o valor-base para calcular a sugestão.');
  result.setAttribute('aria-live','polite');
  base.oninput = () => {
    result.textContent = base.value && base.validity.valid
      ? 'Valor sugerido · '+money.format(Math.max(0,base.valueAsNumber-total))
      : 'Informe o valor-base para calcular a sugestão.';
  };
  label.append(base);
  container.append(list,element('p','Desconto indicativo · '+money.format(total),'price'),label,result);
}

const sample = [
  {id:'demo-1',model:'Chevrolet Onix Plus',trim:'LTZ Turbo',year:2023,km:42100,value:74500,evaluated:Date.now()-86400000},
  {id:'demo-2',model:'Ford EcoSport',trim:'Titanium 1.6',year:2013,km:119000,value:38900,evaluated:Date.now()-172800000},
  {id:'demo-3',model:'Chevrolet Spin',trim:'LTZ 1.8 automática',year:2013,km:134000}
];
const database = new Promise((resolve,reject) => {
  const request = indexedDB.open('consigna',1);
  request.onupgradeneeded = () => {
    const store = request.result.createObjectStore('vehicles',{keyPath:'id'});
    sample.forEach(vehicle => store.add(vehicle));
  };
  request.onsuccess = () => resolve(request.result);
  request.onerror = () => reject(request.error);
});
let vehicles = [], page = 'feed', mediaUrls = [], dialogUrls = [];
const master = () => $('#role').value === 'master';
function element(tag, value, className) {
  const node = document.createElement(tag);
  if (value !== undefined) node.textContent = value;
  if (className) node.className = className;
  return node;
}
function button(label, action, style) {
  const node = element('button',label,style);
  node.type = 'button';
  node.onclick = action;
  return node;
}
async function readVehicles() {
  const db = await database;
  return new Promise((resolve,reject) => {
    const request = db.transaction('vehicles').objectStore('vehicles').getAll();
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}
async function save(vehicle) {
  const db = await database;
  await new Promise((resolve,reject) => {
    const transaction = db.transaction('vehicles','readwrite');
    transaction.oncomplete = resolve;
    transaction.onabort = () => reject(transaction.error);
    transaction.objectStore('vehicles').put(vehicle);
  });
  vehicles = await readVehicles();
}
function notice(message) { $('#status').textContent = message; }
function media(blob, urls) {
  const url = URL.createObjectURL(blob);
  urls.push(url);
  return url;
}
function release(urls) { urls.splice(0).forEach(url => URL.revokeObjectURL(url)); }
function show(next) {
  page = next;
  notice('');
  render();
}
function photo(vehicle, urls) {
  if (!vehicle.photo) return element('div','Sem foto','media');
  const image = element('img',undefined,'media');
  image.src = media(vehicle.photo,urls);
  image.alt = vehicle.model;
  return image;
}
function description(vehicle) {
  return [vehicle.trim,vehicle.year,number.format(vehicle.km)+' km'].filter(Boolean).join(' · ');
}
function details(vehicle) {
  const container = $('#detail');
  container.replaceChildren(element('h2',vehicle.model),element('p',description(vehicle)));
  container.append(photo(vehicle,dialogUrls));
  if (vehicle.evaluated) container.append(element('p',money.format(vehicle.value),'price'));
  if (master() && vehicle.owner) {
    container.append(element('p','Proprietário · '+vehicle.owner),element('p','WhatsApp · '+vehicle.phone));
  }
  if (vehicle.video) {
    const video = element('video');
    video.controls = true;
    video.playsInline = true;
    video.preload = 'metadata';
    video.src = media(vehicle.video,dialogUrls);
    container.append(video);
  }
  if (master() && vehicle.answers) showAssessment(vehicle,container);
  if (master() && !vehicle.evaluated) {
    const form = element('form');
    const label = element('label','Valor da avaliação em reais');
    const input = element('input');
    Object.assign(input,{type:'number',min:'0.01',step:'0.01',inputMode:'decimal',required:true});
    label.append(input);
    const submit = element('button','Salvar avaliação e publicar no feed','primary');
    const feedback = element('p');
    feedback.setAttribute('role','status');
    form.append(label,submit,feedback);
    form.onsubmit = async event => {
      event.preventDefault();
      if (!master()) return;
      submit.disabled = true;
      try {
        await save({...vehicle,value:input.valueAsNumber,evaluated:Date.now()});
        $('dialog').close();
        show('feed');
        notice('Avaliação publicada no feed.');
      } catch {
        feedback.textContent = 'Não foi possível salvar a avaliação. Tente novamente.';
        submit.disabled = false;
      }
    };
    container.append(form);
  }
  if (master() && vehicle.evaluated) {
    const unavailable = !vehicle.unavailable;
    const feedback = element('p');
    feedback.setAttribute('role','status');
    const action = button(unavailable ? 'Marcar como indisponível' : 'Recolocar no feed',async () => {
      if (!master()) return;
      action.disabled = true;
      try {
        await save({...vehicle,unavailable});
        $('dialog').close();
        render();
        notice(unavailable ? 'Veículo retirado do feed.' : 'Veículo de volta ao feed.');
      } catch {
        feedback.textContent = 'Não foi possível alterar a disponibilidade. Tente novamente.';
        action.disabled = false;
      }
    });
    container.append(action,feedback);
  }
  $('dialog').showModal();
}
function cards(container, list) {
  release(mediaUrls);
  container.replaceChildren();
  if (!list.length) container.append(element('p','Nenhum veículo encontrado.','empty'));
  list.forEach(vehicle => {
    const card = element('article',undefined,'card');
    card.append(photo(vehicle,mediaUrls),element('h2',vehicle.model),element('p',description(vehicle)));
    if (vehicle.evaluated) {
      card.append(element('p',money.format(vehicle.value),'price'),element('p','Avaliado em '+date.format(vehicle.evaluated)));
    } else {
      card.append(element('p','Aguardando avaliação','badge'));
    }
    if (page === 'feed' && vehicle.photo) {
      const download = element('a','Baixar foto','download-photo');
      download.href = card.querySelector('img').src;
      download.download = vehicle.photo.name || 'foto-do-veiculo';
      download.setAttribute('aria-label','Baixar foto de '+vehicle.model);
      card.append(download);
    }
    if (vehicle.unavailable) card.append(element('p','Indisponível','badge'));
    card.append(button(vehicle.evaluated ? 'Ver detalhes' : 'Avaliar veículo',() => details(vehicle)));
    container.append(card);
  });
}
const pages = {
  feed:['Feed de avaliações','Consulte os veículos avaliados para consignação.'],
  pending:['Pendentes de avaliação','Registre o valor para publicar o veículo no feed.'],
  unavailable:['Veículos indisponíveis','Consulte os veículos retirados do feed e recoloque-os quando estiverem disponíveis.'],
  register:['Cadastrar veículo','Preencha os dados do proprietário e do veículo.']
};
const navigationIcons = {feed:'▤',pending:'◷',unavailable:'⊘',register:'＋'};
const navigationLabels = {feed:'Feed',pending:'Pendentes',unavailable:'Retirados',register:'Cadastrar'};
function render() {
  document.body.dataset.profile = master() ? 'master' : 'viewer';
  release(mediaUrls);
  $('nav').replaceChildren();
  Object.entries(pages).filter(([id]) => master() || id === 'feed').forEach(([id]) => {
    const item = button(navigationLabels[id],() => {
      show(id);
      window.scrollTo(0,0);
    });
    item.dataset.section = id;
    const icon = element('span',navigationIcons[id],'nav-icon');
    icon.setAttribute('aria-hidden','true');
    item.prepend(icon);
    if (id === page) item.setAttribute('aria-current','true');
    $('nav').append(item);
  });
  const [title,intro] = pages[page];
  $('h1').textContent = title;
  $('#intro').textContent = intro;
  const content = $('#content');
  content.replaceChildren();
  if (page === 'register') {
    content.append($('#registration').content.cloneNode(true));
    $('#register').onsubmit = register;
    const actions = element('div');
    actions.style.cssText = 'display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px';
    const link = element('a','Abrir formulário de pré-avaliação');
    Object.assign(link,{href:'?pre-avaliacao',target:'_blank',rel:'noopener'});
    const copy = button('Copiar link',async () => {
      try {
        await navigator.clipboard.writeText(link.href);
        notice('Link da pré-avaliação copiado.');
      } catch {
        window.prompt('Copie o link da pré-avaliação:',link.href);
      }
    },'');
    const open = button(link.textContent,() => link.click());
    actions.append(open,copy);
    content.prepend(actions);
    return;
  }
  const list = vehicles.filter(vehicle => {
    if (page === 'pending') return !vehicle.evaluated;
    if (page === 'unavailable') return master() && vehicle.evaluated && vehicle.unavailable;
    return vehicle.evaluated && !vehicle.unavailable;
  })
    .sort((a,b) => (b.evaluated || b.created || 0)-(a.evaluated || a.created || 0));
  if (page === 'pending' && master()) {
    const intake = element('div',undefined,'intake');
    const label = element('label','Importar ficha do cliente');
    const file = element('input');
    Object.assign(file,{type:'file',accept:'.json,application/json'});
    file.onchange = async () => {
      if (!master() || !file.files[0]) return;
      file.disabled = true;
      try {
        await importAssessment(file.files[0]);
        render();
        notice('Pré-avaliação importada para Pendentes.');
      } catch (error) {
        notice(error?.name === 'ConstraintError' ? 'Esta ficha já foi importada.' : 'Não foi possível importar. Confira o arquivo recebido.');
        file.value = '';
        file.disabled = false;
      }
    };
    label.append(file);
    intake.append(label);
    content.append(intake);
  }
  const grid = element('div',undefined,'grid');
  if (page === 'feed') {
    const search = element('input');
    Object.assign(search,{id:'search',type:'search',placeholder:'Buscar por modelo, versão ou ano'});
    search.setAttribute('aria-label','Buscar veículos avaliados');
    search.oninput = () => {
      const normalize = value => value.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
      const query = normalize(search.value.trim());
      cards(grid,list.filter(vehicle => normalize([vehicle.model,vehicle.trim,vehicle.year].join(' ')).includes(query)));
    };
    content.append(search);
  }
  content.append(grid);
  cards(grid,list);
}
async function register(event) {
  event.preventDefault();
  if (!master()) return;
  const form = event.currentTarget;
  const data = Object.fromEntries(new FormData(form));
  for (const field of ['owner','phone','model','trim']) data[field] = data[field].trim();
  if (!data.owner || !data.model || data.phone.replace(/\D/g,'').length < 10) {
    notice('Confira o nome, o modelo e o número de WhatsApp.');
    return;
  }
  const submit = form.querySelector('button');
  submit.disabled = true;
  try {
    await save({...data,id:crypto.randomUUID(),created:Date.now(),photo:data.photo.size ? data.photo : null,video:data.video.size ? data.video : null});
    if (master()) show('pending');
    notice('Veículo cadastrado e aguardando avaliação.');
  } catch {
    notice('Não foi possível salvar o cadastro. Confira o espaço disponível e tente novamente.');
    submit.disabled = false;
  }
}
$('dialog').addEventListener('close',() => release(dialogUrls));
$('#role').onchange = () => {
  $('dialog').close();
  show('feed');
};
if (new URLSearchParams(location.search).has("pre-avaliacao")) customerForm();
else readVehicles().then(result => { vehicles = result; render(); }).catch(() => notice('O armazenamento local está indisponível.'));
</script></body></html>
