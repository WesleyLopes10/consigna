.vehicle-kind-options{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
#pre-form .vehicle-kind-options label{display:flex;align-items:center;gap:6px;min-height:44px;padding:8px 10px;margin:0;border:1px solid #eadcde;border-radius:9px;background:white;cursor:pointer}
#pre-form .vehicle-kind-options input{width:18px;height:18px;min-height:0;accent-color:#b0182c}
#pre-form .vehicle-kind-options label:has(input:checked){border-color:#b0182c;background:#fce8eb}
.used-market-heading{display:flex;align-items:center;flex-wrap:wrap;gap:12px}
.used-market-heading img{display:block;width:120px;max-width:100%;height:auto}

/* Avalia Top visual system */
:root{--ui-bg:#f1f3f7;--ui-surface:#fff;--ui-ink:#141e32;--ui-muted:#4d5b70;--ui-border:#dce3ed;--ui-red:#b0182c;--ui-tint:#fff0f1;--ui-shadow:0 2px 6px #1421390d}
body,body[data-profile=master]{background:var(--ui-bg);color:var(--ui-ink);font-family:Inter,system-ui,sans-serif}
p{color:var(--ui-muted)}
h1,h2,h3,h4{color:var(--ui-ink);letter-spacing:-.025em}
header{background:var(--ui-red);box-shadow:0 2px 10px #17213b20}
main{padding-top:clamp(22px,4vw,46px)}
button,input,select{border-color:#c9d3e1}
button:not(:disabled):hover{border-color:var(--ui-red)}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #265db4;outline-offset:3px}
.home-start,button.primary{background:var(--ui-red);color:white;box-shadow:0 4px 10px #b0182c25}
.home-hero{border-color:var(--ui-border);box-shadow:var(--ui-shadow);border-radius:18px}
.home-artwork{background:#f9fafc}
.home-copy h1{line-height:1.08}
.card,form,.empty,.intake,.vehicle-gallery,dialog{background:var(--ui-surface);border-color:var(--ui-border);box-shadow:var(--ui-shadow)}
.card h2{font-size:19px}
.card .media{background:#edf1f7}
#search{border-color:#c9d3e1}
body[data-profile=master] main>nav{border-color:var(--ui-border)}
body[data-profile=master] main>nav button:not([aria-current=true]){background:#f6f8fb;color:var(--ui-ink)}
body[data-profile=master] main>nav button[aria-current=true]{background:var(--ui-tint);color:var(--ui-red);border-color:#ebbac2}
body[data-profile=master] main>nav button[aria-current=true] .nav-icon{color:var(--ui-red)}
#pre-form{border-color:var(--ui-border);box-shadow:var(--ui-shadow)}
#pre-form input:not([type=radio]):not([type=range]),#pre-form select{background:#fff;border-color:#c9d3e1}
#pre-form label{font-weight:650;color:var(--ui-ink)}
.pre-steps li{background:#eef2f7;color:var(--ui-muted)}
.pre-steps li.complete{background:var(--ui-tint);color:var(--ui-red)}
.pre-steps li[aria-current=step]{background:var(--ui-red);color:white}
#pre-form .pre-question{background:#f8faff;border-color:var(--ui-border)}
.pre-section h3{background:#eef2f7;color:var(--ui-ink)}
#pre-form .section-photo,#pre-form .pre-mileage{color:#861426}
.master-review .assessment-panel,.master-review .assessment-final,.master-review .vehicle-gallery{border-color:var(--ui-border);box-shadow:var(--ui-shadow)}
.market-references:has(.fipe-card){grid-template-columns:minmax(0,1fr)}
.market-references .fipe-card,.market-references .fipe-card:first-child{border:1px solid var(--ui-border);background:#fff;box-shadow:var(--ui-shadow);padding:16px}
.fipe-card h4{font-size:17px;margin:4px 0 12px}
.fipe-metadata{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,120px),1fr));gap:10px;margin:0 0 12px}
.fipe-metadata dt,.fipe-value span{font-size:12px;font-weight:750;color:var(--ui-muted)}
.fipe-metadata dd{margin:3px 0 0;font-weight:650}
.fipe-value{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:10px 13px;border:1px solid #f0c0c7;background:var(--ui-tint);border-radius:10px}
.fipe-value strong{font-size:clamp(20px,3vw,26px);color:var(--ui-ink)}
@media(max-width:640px){
 body[data-profile=master] main>nav{background:#fff}
 .master-metric{font-size:12px;overflow-wrap:anywhere}
 .pre-steps li{font-size:12px}
 .market-toolbar button{width:100%}
}

:root{--ui-radius:14px;--ui-control-radius:10px;--ui-soft:#f5f7fb}
button,select,input,.download-photo,.home-start{border-radius:var(--ui-control-radius)}
.card,form,.empty,.assessment-panel,.vehicle-gallery,.market-card,.master-review .assessment-final{border-radius:var(--ui-radius)}
#status:not(:empty){background:var(--ui-soft);border:1px solid var(--ui-border);color:var(--ui-ink)}
.download-photo{background:var(--ui-surface);border-color:var(--ui-border);color:var(--ui-ink)}
.download-photo:hover{border-color:var(--ui-red);color:var(--ui-red)}
.card .badge{background:#eef2f7;color:#35465e;border:1px solid var(--ui-border);border-radius:999px}
input[type=file]::file-selector-button{background:#edf2f8;color:var(--ui-ink);border-radius:8px}
#pre-form .section-photo input::file-selector-button{background:var(--ui-red);color:white}
#pre-form .section-photo,#pre-form .pre-mileage,.photo-guide{border-radius:var(--ui-radius)}
#pre-form .pre-slider-labels button{background:white;border-color:var(--ui-border);color:var(--ui-ink)}
#pre-form .pre-slider-labels button[aria-pressed=true]{background:var(--ui-tint);border-color:var(--ui-red);color:#861426}
dialog::backdrop{background:#111b30a0}
dialog .media,.vehicle-gallery .media,.market-listing-photo{background:#edf1f7;border-radius:var(--ui-control-radius)}
.master-review .assessment-summary,.master-review .assessment-final{border-top:3px solid var(--ui-red)}
.master-review h3{color:var(--ui-ink)}
.market-specs dt,.assessment-list li span{color:var(--ui-muted)}
.market-specs div{border-color:var(--ui-border)}
.market-panel .market-price{font-variant-numeric:tabular-nums}
[data-market-report] .market-references .market-card{border:1px solid var(--ui-border);background:var(--ui-soft)}
[data-market-report] .market-references .market-card:nth-child(2){background:var(--ui-tint);border-color:#ebbac2}
@media(max-width:640px){dialog{border-radius:18px 18px 0 0}}

.fipe-history{margin-top:12px}
.fipe-history>button{width:100%;background:#edf3ff;color:#194789;font-weight:700}
.fipe-history [role=status]:empty{display:none}
.history-periods{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.history-periods button[aria-pressed=true]{background:#265db4;color:white;border-color:#265db4}
.history-metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,145px),1fr));gap:8px}
.history-metrics div{display:grid;gap:3px;padding:10px;border-radius:9px;background:#f5f7fb}
.history-metrics span{font-size:12px;color:#4d5b70}
.fipe-history svg{display:block;width:100%;height:auto;margin-top:12px}
</style>

<strong id="photo-guide-title">Atenção à qualidade das fotos</strong>

<aside class="photo-guide">
<strong>Antes de gravar</strong>
<ul><li>Estacione em um local seguro e bem iluminado. Prefira luz natural e evite filmar contra o sol.</li><li>Dê uma volta completa em torno do carro, mostrando a frente, as duas laterais e a traseira.</li><li>Ande devagar e mantenha o carro inteiro no quadro, sem cortes ou obstáculos.</li></ul>

function configureCustomerFields(form) {
  const {phone,brand,model} = form.elements;
  function populate(id,values) {
    $(id).replaceChildren(...values.map(value => new Option(value,value)));
  }
  populate('#pre-cities',citySuggestions);
  populate('#pre-brands',Object.keys(vehicleSuggestions).sort((a,b) => a.localeCompare(b,'pt-BR')));
  brand.addEventListener('input',() => {
    const key = Object.keys(vehicleSuggestions).find(name =>
      name.localeCompare(brand.value.trim(),'pt-BR',{sensitivity:'base'}) === 0);
    populate('#pre-models',key ? vehicleSuggestions[key] : []);
  });
  phone.addEventListener('input',() => {
    let digits = phone.value.replace(/\D/g,'');
    if (digits.length > 11 && digits.startsWith('55')) digits = digits.slice(2);
    digits = digits.slice(0,11);
    const area = digits.slice(0,2);
    const local = digits.slice(2);
    const split = digits.length === 11 ? 5 : 4;
    phone.value = digits.length < 3 ? (area ? '('+area : '') :
      '('+area+') '+local.slice(0,split)+(local.length > split ? '-'+local.slice(split) : '');
    phone.setCustomValidity(digits.length >= 10 || !digits.length ? '' : 'Informe o DDD e o telefone completo.');
  });
}

function encode(file) {
  return new Promise((resolve,reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve({name:file.name,data:reader.result});
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });

function inspectionDiagram(index) {
  const illustration = element('img',undefined,'inspection-art');
  illustration.src = 'data:image/webp;base64,'+inspectionImages[index];
  illustration.alt = '';
  illustration.loading = 'lazy';
  return illustration;
}

function customerForm() {
  document.body.classList.add("customer-app");
  $('header label').remove();
  $('nav').remove();
  $('h1').textContent = 'Faça a avaliação do seu carro';
  $('#intro').textContent = 'Preencha a ficha para receber sua primeira avaliação.';
  $('#content').append($('#pre-template').content.cloneNode(true));
  const form = $('#pre-form');
  configureCustomerFields(form);
  let catalogRequested = false;
  form.addEventListener('focusin',async event => {
    if (catalogRequested || !['plate','fipeType','fipeFuel'].includes(event.target.name)) return;
    catalogRequested = true;
    try {
      const response = await fetch('./api/fipe-catalogos',{signal:AbortSignal.timeout(9000)});
      if (!response.ok) throw Error();
      const {types,fuels} = await response.json();
      $('#fipe-types').replaceChildren(...types.map(item => new Option(item.label,item.label)));
      $('#fipe-fuels').replaceChildren(...fuels.map(item => new Option(item.label,item.label)));
    } catch { catalogRequested = false; }
  });
  const {plate,brand,model,year} = form.elements;
  let plateLookup;
  plate.addEventListener('input',() => { form.elements.reportedYear.value = ''; });
  const lookupStatus = element('p');
  lookupStatus.setAttribute('role','status');
  const lookup = button('Consultar placa',async () => {
    const value = plate.value.trim().toUpperCase();
    if (!plate.reportValidity()) return;
    lookup.disabled = true;
    lookupStatus.textContent = 'Consultando placa…';
    try {
      const response = await fetch('./api/placa?placa='+encodeURIComponent(value)+'&modo=cadastro',{signal:AbortSignal.timeout(10000)});
      if (!response.ok) throw Error('Consulta indisponível');
      const data = await response.json();
      if (plate.value.trim().toUpperCase() !== value) {
        lookupStatus.textContent = 'A placa mudou. Consulte novamente.';
        return;
      }
      plateLookup = {plate:value,data,consultedAt:Date.now()};
      if (data.brand) {
        brand.value = data.brand;
        brand.dispatchEvent(new Event('input'));
      }
      if (data.model) model.value = data.model;
      form.elements.reportedYear.value = data.specs?.ano_fabricacao || data.specs?.ano || '';
      if (data.year) year.value = data.year;
      if (!form.elements.fipeFuel.value && data.specs?.combustivel) form.elements.fipeFuel.value = data.specs.combustivel;
      if (!form.elements.fipeType.value && data.specs?.tipo_veiculo) form.elements.fipeType.value = data.specs.tipo_veiculo;
      lookupStatus.textContent = 'Confira os dados e complete os campos que faltarem.';
    } catch {
      lookupStatus.textContent = 'Não foi possível consultar a placa. Preencha os dados manualmente.';
    } finally {
      lookup.disabled = false;
    }
  });
  plate.closest('label').after(lookup,lookupStatus);
  const steps = [...form.querySelectorAll('fieldset')];
  let step = 0;
  const back = $('#pre-back'), next = $('#pre-next');
  function display() {
    steps.forEach((section,index) => section.hidden = section.disabled = index !== step);
    back.hidden = step === 0;
    next.textContent = step === steps.length-1 ? 'Enviar pré-avaliação' : 'Continuar';
    $('#pre-progress').textContent = 'Etapa '+(step+1)+' de '+steps.length;
    form.querySelectorAll('.pre-steps li').forEach((item,index) => {
      item.classList.toggle('complete',index < step);
      if (index === step) item.setAttribute('aria-current','step');
      else item.removeAttribute('aria-current');
    });
    window.scrollTo(0,0);
  }
  checkSections.forEach(([name,indices]) => {
    const section = element('section',undefined,'pre-section');
    section.append(element('h3',name));
    indices.forEach(index => {
      const [title] = checks[index];
      const group = element('fieldset',undefined,'pre-question');
      const choices = element('div',undefined,'pre-choices');
      group.append(element('legend',title));
      group.append(inspectionDiagram(index));
      if (index < 2) {
        group.append(element('p',index === 0 ? 'Vista de fora, pelo lado esquerdo do carro.' : 'Vista de fora, pelo lado direito do carro.','pre-diagram-caption'));
      }
      group.append(choices);
      const ratings = options(index).slice(0,3);
      choices.classList.add('pre-slider');
      const slider = element('input');
      Object.assign(slider,{type:'range',min:'0',max:'2',step:'1',value:'1'});
      slider.setAttribute('aria-label',title);
      slider.setAttribute('aria-valuetext','Escolha uma condição');
      const answer = element('input');
      Object.assign(answer,{type:'hidden',name:'check'+index});
      const labels = element('div',undefined,'pre-slider-labels');
      function selectRating(value) {
        slider.value = answer.value = value;
        slider.setAttribute('aria-valuetext',ratings[value]);
        [...labels.children].forEach((item,position) =>
          item.setAttribute('aria-pressed',String(position === Number(value))));
        updateCount();
      }
      slider.oninput = slider.onchange = () => selectRating(slider.value);
      ratings.forEach((label,value) => {
        const choice = button(label,() => selectRating(value));
        choice.setAttribute('aria-pressed','false');
        labels.append(choice);
      });
      choices.append(slider,answer,labels);
      if (!photoOptionalItems.has(title)) {
        const photoLabel = element('label',undefined,'section-photo');
        const photoInput = element('input');
        Object.assign(photoInput,{type:'file',name:'itemPhoto'+index,accept:'image/*',required:true});
        photoLabel.append(element('strong','Anexar foto obrigatória'),
          element('span',title+' · até 8 MB'),photoInput);
        group.append(photoLabel);
      }
      section.append(group);
    });
    $('#pre-checks').append(section);
  });
  function updateCount() {
    const count = [...form.querySelectorAll('.pre-slider input[type=hidden]')].filter(input => input.value !== '').length;
    $('#pre-count').textContent = count+' de '+checks.length+' itens respondidos';
  }
  $('#pre-checks').onchange = updateCount;
  updateCount();
  back.onclick = () => { notice(''); step--; display(); };
  form.onsubmit = async event => {
    event.preventDefault();
    if (step < steps.length-1) { step++; display(); return; }
    const missing = [...form.querySelectorAll('.pre-slider input[type=hidden]')].find(input => input.value === '');
    if (missing) {
      notice('Escolha uma condição para cada item do checklist.');
      missing.previousElementSibling.focus();
      return;
    }
    steps.forEach(section => section.disabled = false);
    const data = new FormData(form);
    display();
    const photos = checks.flatMap(([title],index) => photoOptionalItems.has(title) ? [] : [data.get('itemPhoto'+index)]);
    const video = data.get('video');
    if (photos.some(photo => photo.size > 8*1024**2) || video.size > 25*1024**2) {
      notice('Use uma foto de até 8 MB por pergunta que pede foto e um vídeo de até 25 MB.');
      return;
    }
    next.disabled = back.disabled = true;
    notice('');
    const screen = element('section',undefined,'empty');
    screen.setAttribute('role','status');
    screen.setAttribute('aria-busy','true');
    screen.append(element('h2','Preparando sua estimativa…'),element('progress'));
    form.hidden = true;
    $('#content').append(screen);
    window.scrollTo(0,0);
    try {
      const report = Object.fromEntries(fields.map(key => [key,data.get(key).trim()]));
      report.model = data.get('brand').trim()+' '+report.model;
      report.plate = report.plate.toUpperCase();
      report.vehicleKind = data.get('vehicleKind');
      report.fipeType = data.get('fipeType').trim();
      report.fipeFuel = data.get('fipeFuel').trim();
      report.reportedYear = data.get('reportedYear');
      if (plateLookup?.plate === report.plate) report.plateLookup = plateLookup;
      Object.assign(report,{id:crypto.randomUUID(),created:Date.now(),photo:photos[0],photos,video,
        answers:checks.map((_,index) => Number(data.get('check'+index)))});
      const pdf = await repairPdf(report);
      await save(report);
      screen.removeAttribute('aria-busy');
      screen.replaceChildren(element('h2','Sua primeira avaliação está pronta'),
        element('p','A pré-avaliação foi salva neste navegador.'),
        button('Baixar primeira avaliação em PDF',() => downloadFile(pdf,'avalia-top-primeira-avaliacao.pdf'),'primary'));
    } catch {
      screen.remove();
      form.hidden = false;
      notice('Não foi possível concluir. Confira as fotos e tente novamente.');
    } finally {
      next.disabled = back.disabled = false;
    }
  };
  display();
}
function decode(media,kind,limit) {
  const match = typeof media?.data === 'string' && media.data.match(/^data:([a-z]+\/[a-z0-9.+-]+);base64,([a-z0-9+/=]+)$/i);
  if (!match || !match[1].startsWith(kind+'/')) throw Error('Mídia inválida');
  const bytes = Uint8Array.from(atob(match[2]),char => char.charCodeAt(0));
  if (!bytes.length || bytes.length > limit*1024**2) throw Error('Tamanho inválido');
  return new File([bytes],String(media.name || kind),{type:match[1]});
}
async function importAssessment(file) {
  if (file.size > 46*1024**2) throw Error('Tamanho inválido');
  const report = JSON.parse(await file.text());
  if (!report || report.version !== 1 || !/^[a-f0-9-]{36}$/i.test(report.id) ||
      !fields.every(key => typeof report[key] === 'string' && report[key].trim() && report[key].length <= 120) ||
      !/^[a-z]{3}[0-9][a-z0-9][0-9]{2}$/i.test(report.plate) ||
      !Number.isInteger(Number(report.year)) || Number(report.year)<1886 || Number(report.year)>2100 ||
      !Number.isSafeInteger(Number(report.km)) || Number(report.km)<0 ||
      !Array.isArray(report.answers) || ![10,checks.length].includes(report.answers.length) ||
      !report.answers.every(value => Number.isInteger(value) && value >= 0 && value <= 3)) throw Error('Ficha inválida');
  const id = 'pre-'+report.id;
  const vehicle = Object.fromEntries(fields.map(key => [key,report[key]]));
  Object.assign(vehicle,{id,created:Date.now(),answers:report.answers,photo:decode(report.photo,'image',8),video:decode(report.video,'video',25)});

  await new Promise((resolve,reject) => {

    transaction.oncomplete = resolve;

function repairRows(answers) {
  return answers.map((answer,index) => {
    const [name,minor,major] = checks[index];
    const center = [0,minor,major,0][answer];
    const painting = index < 5 && answer === 1;
    return {name,condition:options(index)[answer],pending:answer === 3,
      low:painting ? 500 : Math.floor(center*.75/50)*50,
      high:painting ? (index === 4 ? 1000 : 500) : Math.ceil(center*1.25/50)*50};
  });
}
function repairRange(low,high) {
  return low === high ? money.format(low) : money.format(low)+' a '+money.format(high);
}
function downloadFile(blob,name) {
  const url = URL.createObjectURL(blob);
  const link = element('a');
  link.href = url;
  link.download = name;
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url),30000);
}
async function repairReport(report) {

  } catch {
    notice('Não foi possível gerar o PDF.');
  }
}
async function repairPdf(report) {
  const hex = value => Array.from(String(value),char => {
    const point = char === '\u00a0' ? 32 : char.codePointAt(0);
    return (point >= 32 && point <= 255 ? point : 63).toString(16).padStart(2,'0');
  }).join('');
  const text = (value,x,y,size = 11) =>
    'BT /F1 '+size+' Tf '+x+' '+y+' Td <'+hex(value)+'> Tj ET\n';
  const rows = repairRows(report.answers);
  const low = rows.reduce((sum,row) => sum+row.low,0);
  const high = rows.reduce((sum,row) => sum+row.high,0);
  let stream = '0.62 0.06 0.13 rg 36 738 523 66 re f\n1 1 1 rg\n';
  stream += text('AVALIA TOP',52,774,19)+text('Primeira avaliação',52,751,13);
  stream += '0.07 0.17 0.14 rg\n';
  const model = Array.from(report.model || '');
  stream += text(model.slice(0,72).join(''),36,710);
  stream += text(model.slice(72).join(''),36,695);
  stream += text([report.code,vehicleYears(report),report.plate,number.format(report.km)+' km'].filter(Boolean).join(' | '),36,676);
  rows.forEach((row,index) => {
    const y = 576-index*23;
    stream += text(row.name,36,y,10)+text(row.pending ? row.condition+' - conferir' : row.condition,270,y,10);
  });
  stream += '0.99 0.91 0.92 rg 36 600 523 61 re f\n0.07 0.17 0.14 rg\n';
  stream += text('VALOR MÉDIO ESTIMADO DOS REPAROS',48,644,11);
  stream += text(money.format((low+high)/2),48,617,23);
  const bottom = 576-rows.length*23-12;
  stream += text('Valores indicativos. Itens a conferir ficam fora do total.',36,bottom-46,10);
  stream += text('O custo final depende da inspeção e do orçamento da oficina.',36,bottom-62,10);
  const objects = [
    '<< /Type /Catalog /Pages 2 0 R >>',
    '<< /Type /Pages /Count 1 /Kids [3 0 R] >>',
    '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 4 0 R >> >> /Contents 5 0 R >>',
    '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>',
    '<< /Length '+stream.length+' >>\nstream\n'+stream+'endstream'
  ];
  let pdf = '%PDF-1.4\n';
  const offsets = objects.map((object,index) => {
    const offset = pdf.length;
    pdf += (index+1)+' 0 obj\n'+object+'\nendobj\n';
    return offset;
  });
  const xref = pdf.length;
  pdf += 'xref\n0 '+(objects.length+1)+'\n0000000000 65535 f \n';
  offsets.forEach(offset => { pdf += String(offset).padStart(10,'0')+' 00000 n \n'; });
  pdf += 'trailer\n<< /Size '+(objects.length+1)+' /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF\n';
  return new Blob([pdf],{type:'application/pdf'});
}

function showAssessment(vehicle,container) {
  const panel = element('section',undefined,'assessment-panel');
  panel.append(element('h3','Pré-avaliação do cliente'));
  const rows = repairRows(vehicle.answers);
  let total = 0;
  checkSections.forEach(([title,indices]) => {
    const list = element('ul',undefined,'assessment-list');
    indices.forEach(index => {
      const row = rows[index];

      total += (row.low+row.high)/2;
      const item = element('li');
      item.append(element('strong',row.name),
        element('span',row.condition),
        element('span',row.pending ? 'Conferir' : repairRange(row.low,row.high),'assessment-cost'));
      list.append(item);
    });

function element(tag, value, className) {

async function readVehicles() {
  const db = await database;
  return new Promise((resolve,reject) => {
    const request = db.transaction('vehicles').objectStore('vehicles').getAll();
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);

}
async function save(vehicle,finalValue) {
  const db = await database;
  await new Promise((resolve,reject) => {
    const transaction = db.transaction('vehicles','readwrite');
    transaction.oncomplete = resolve;
    transaction.onabort = () => reject(transaction.error);
    const store = transaction.objectStore('vehicles');
    if (finalValue === undefined) {
      store.put(vehicle);
      return;
    }
    const request = store.getAll();
    request.onsuccess = () => {
      const current = request.result.find(item => item.id === vehicle.id);
      if (!current?.answers?.length || current.evaluated) {
        transaction.abort();
        return;
      }
      const last = request.result.reduce((max,item) => Math.max(max,Number(item.code?.match(/^COD(\d+)$/)?.[1] || 0)),0);
      const code = 'COD'+String(last+1).padStart(4,'0');
      store.put({...current,code,value:finalValue,evaluated:Date.now()});
    };
  });
  vehicles = await readVehicles();
}

function updateRoute(next,vehicleId) {

  const params = new URLSearchParams(location.search);
  const route = Object.keys(pageRoutes).find(key => pageRoutes[key] === params.get('pagina')) || 'home';
  const role = ['pending','unavailable','register','evaluation'].includes(route) ? 'master' :
    route === 'home' ? 'home' : (master() ? 'master' : 'viewer');
  $('#role').value = role;

  if ($('dialog').open) $('dialog').close();

  await new Promise((resolve,reject) => {
    const transaction = db.transaction('vehicles','readwrite');
    transaction.oncomplete = resolve;
    transaction.onabort = () => reject(transaction.error || Error('Ficha alterada'));
    const store = transaction.objectStore('vehicles');
    const request = store.get(vehicle.id);
    request.onsuccess = () => {

bbq1Df2wx1M2xH8zaqm+jeZ3Mrjn2s+P46vrIpO/W6sblR8v4X27fCl/9vBU++3EDvLD6Q2RtCnoC6IL4oTcQRX+pg35+1077PBp6xNQtX5E1qlaVeVSvzJwrdK1qrG61Kqx+xYqsYaVKrH59j861vJs/x0K9trDg1ieYd+0c1rbKddamcg7zdLMIlWWwOjaew20b7XmT62Zp22jjmZXpoizT9Nq6lLWubiZ1ddKONs7a4laGYMzHWZ9VdlJuGfbbuBpbN9flmfVXGzeTNsu0bd0oXGc+dXJYqOdJFua1tYp3iwX16rn7Epe1MdStUZ01RFZrV9MvBf8PTN44wwrCFPAAAAAASUVORK5CYII=',alt:''});

  label.append(model);

  status.setAttribute('role','status');

    if (!query) { model.focus(); return; }
    lookup.disabled = true;
    status.textContent = 'Buscando anúncios…';
    results.replaceChildren();
    panel.querySelector('[data-market-report]')?.remove();
    try {
      if (query === defaults.model) {
        try {
          const normalized = await normalizeVehicle(vehicle,defaults.motor);
          query = model.value = defaults.model = normalized.model;
          defaults.motor = normalized.motor;
        } catch {
          status.textContent = 'Busca com os dados disponíveis. Ajuste o modelo se necessário.';
        }
      }
      const response = await fetch('./api/usado-facil?'+new URLSearchParams({modelo:query,motorizacao:defaults.motor,ano:defaults.year,anoModelo:vehicle.year || ''}));
      if (response.status === 503) {
        status.textContent = 'Busca ainda não configurada no servidor.';
        return;
      }
      if (!response.ok) {
        const error = await response.json().catch(() => ({}));
        status.textContent = error.error || 'Não foi possível buscar os anúncios.';
        const direct = new URL('https://www.usadofacil.com.br/v6/resultado_busca.asp');
        direct.search = new URLSearchParams({veiculo:query.toUpperCase(),
          motorizacao:defaults.motor,anomin:defaults.year});
        const link = element('a','Abrir busca no Usado Fácil');
        Object.assign(link,{href:direct.href,target:'_blank',rel:'noopener noreferrer'});
        results.append(link);
        return;
      }
      const {cars,stats,aiValidated} = await response.json();
      const search = new URL('https://www.usadofacil.com.br/v6/resultado_busca.asp');
      search.search = new URLSearchParams({veiculo:query.toUpperCase(),
        motorizacao:defaults.motor,anomin:defaults.year});
      const report = element('section',undefined,'market-card');
      report.dataset.marketReport = 'true';
      report.append(element('h4','Faixa de preços anunciados'));
      if (stats) {
        const metrics = element('div',undefined,'market-references');
        [['Mínimo',stats.min],['Médio',stats.mean],['Máximo',stats.max]].forEach(([label,value]) => {
          const metric = element('div',undefined,'market-card');
          metric.append(element('strong',label),element('p',money.format(value),'market-price'));
          metrics.append(metric);
        });
        report.append(metrics,element('p','Base: '+stats.count+' anúncio(s) comparável(is) validados pela IA.'));
      } else report.append(element('p',aiValidated ? 'Nenhum anúncio comparável para calcular a faixa.' : 'A faixa de preços está indisponível. Confira os anúncios abaixo.'));
      results.before(report);
      cars.forEach(car => {
        const card = element('article',undefined,'market-card');
        const link = element('a','Ver busca no Usado Fácil');
        Object.assign(link,{href:search.href,target:'_blank',rel:'noopener noreferrer'});
        if (car.photo) {
          const image = element('img',undefined,'market-listing-photo');
          Object.assign(image,{src:car.photo,alt:car.title,loading:'lazy',referrerPolicy:'no-referrer'});
          image.onerror = () => image.replaceWith(element('p','Foto indisponível no anúncio'));
          card.append(image);
        } else {
          card.append(element('p','Foto indisponível no anúncio'));
        }
        card.append(element('strong',car.title));
        if (car.version && car.version !== car.title) card.append(element('p',car.version));
        card.append(element('p',money.format(car.amount),'market-price'),
          element('p',[car.year,car.mileage].filter(Boolean).join(' · ')));
        if (car.dealer || car.location) card.append(element('p',[car.dealer,car.location].filter(Boolean).join(' · ')));
        card.append(link);
        results.append(card);
      });
      status.textContent = cars.length ? '' : 'Nenhum anúncio encontrado.';
    } catch {
      status.textContent = 'Não foi possível buscar os anúncios. Tente novamente.';
    } finally { lookup.disabled = false; }
  });
  panel.append(label,lookup,status,results);
  return panel;
}

function fipeHistory(row) {
  const box = element('section',undefined,'fipe-history');
  const status = element('p');
  status.setAttribute('role','status');
  const chart = element('div');
  let points;
  const action = button('Ver desvalorização',async () => {
    if (points) {
      chart.hidden = !chart.hidden;
      action.textContent = chart.hidden ? 'Ver desvalorização' : 'Ocultar desvalorização';
      action.setAttribute('aria-expanded',String(!chart.hidden));
      return;
    }
    action.disabled = true;
    status.textContent = 'Carregando histórico FIPE…';
    try {
      const response = await fetch('./api/desvalorizometro',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({id:row.historyId}),signal:AbortSignal.timeout(10000)});
      if (!response.ok) throw Error();
      const data = await response.json();
      if (!data.points?.length) {
        status.textContent = 'Histórico mensal indisponível para esta versão.';
        return;
      }
      points = data.points;
      const periods = element('div',undefined,'history-periods');
      const view = element('div');
      const month = new Intl.DateTimeFormat('pt-BR',{month:'short',year:'numeric',timeZone:'UTC'});
      const label = date => month.format(new Date(date+'-01T00:00:00Z'));
      function draw(limit,selected) {
        [...periods.children].forEach(control=>control.setAttribute('aria-pressed',String(control===selected)));
        const series = points.slice(-limit);
        const values = series.map(([,value])=>value);
        const start = values[0], end = values.at(-1);
        const low = Math.min(...values), high = Math.max(...values);
        const mean = values.reduce((sum,value)=>sum+value,0)/values.length;
        const summary = element('div',undefined,'history-metrics');
        [[label(series[0][0]),money.format(start)],[label(series.at(-1)[0]),money.format(end)],
          ['Variação',money.format(end-start)+' ('+new Intl.NumberFormat('pt-BR',{style:'percent',maximumFractionDigits:1}).format((end-start)/start)+')'],
          ['Menor valor',money.format(low)],['Maior valor',money.format(high)],['Média do período',money.format(mean)]].forEach(([name,value])=>{
          const metric = element('div');
          metric.append(element('span',name),element('strong',value));
          summary.append(metric);
        });
        const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
        svg.setAttribute('viewBox','0 0 640 250');
        svg.setAttribute('role','img');
        svg.setAttribute('aria-label','Evolução mensal da FIPE de '+label(series[0][0])+' a '+label(series.at(-1)[0]));
        function shape(tag,attrs) {
          const node = document.createElementNS(svg.namespaceURI,tag);
          Object.entries(attrs).forEach(([key,value])=>node.setAttribute(key,value));
          svg.append(node);
          return node;
        }
        const span = Math.max(high-low,1);
        const coords = values.map((value,index)=>[120+495*index/Math.max(1,values.length-1),215-185*(value-low)/span]);
        [30,122.5,215].forEach((y,index)=>{
          shape('line',{x1:117,y1:y,x2:620,y2:y,stroke:'#dce3ed','stroke-dasharray':'4 4'});
          shape('text',{x:5,y:y+4,'font-size':13,fill:'#4d5b70'}).textContent = money.format(low+span*(1-index/2));
        });
        shape('polyline',{points:coords.map(pair=>pair.join(',')).join(' '),fill:'none',stroke:'#265db4','stroke-width':3});
        coords.forEach(([x,y],index)=>{
          const dot = shape('circle',{cx:x,cy:y,r:3,fill:'#265db4'});
          const title = document.createElementNS(svg.namespaceURI,'title');
          title.textContent = label(series[index][0])+' · '+money.format(values[index]);
          dot.append(title);
        });
        shape('text',{x:120,y:240,'font-size':13,fill:'#4d5b70'}).textContent=label(series[0][0]);
        if(series.length>1) shape('text',{x:615,y:240,'text-anchor':'end','font-size':13,fill:'#4d5b70'}).textContent=label(series.at(-1)[0]);
        view.replaceChildren(summary,svg);
      }
      [['6 meses',6],['1 ano',12],['2 anos',24],['Tudo',Infinity]].forEach(([name,limit])=>{
        const control = button(name,()=>draw(limit,control));
        periods.append(control);
      });
      chart.append(periods,view);
      draw(12,periods.children[1]);
      status.textContent = '';
      action.textContent = 'Ocultar desvalorização';
      action.setAttribute('aria-expanded','true');
    } catch {
      status.textContent = 'Não foi possível carregar o histórico. Tente novamente.';
    } finally { action.disabled = false; }
  });
  action.setAttribute('aria-expanded','false');
  box.append(action,status,chart);
  return box;
}

function marketCards(vehicle,container) {
  const panel = element('section',undefined,'assessment-panel market-panel');
  const heading = element('h3','Tabela FIPE');
  const toolbar = element('div',undefined,'market-toolbar');
  const status = element('p');
  status.setAttribute('role','status');
  const results = element('div');
  const lookup = button('Consultar FIPE e dados da placa',async () => {
    lookup.disabled = true;
    status.textContent = 'Consultando…';
    try {
      const response = await fetch('./api/placa?placa='+encodeURIComponent(vehicle.plate),{signal:AbortSignal.timeout(10000)});
      if (!response.ok) throw Error();
      const data = await response.json();
      const saved = await savePlateLookup(vehicle,data);
      display(saved.data,saved.consultedAt);
      status.textContent = 'Consulta salva na ficha.';
    } catch {
      status.textContent = 'Não foi possível concluir ou salvar a consulta. Tente novamente.';
    } finally {
      lookup.disabled = false;
    }
  });
  function display(data,consultedAt) {
    results.replaceChildren();
    const consulted = Number.isFinite(consultedAt) ? new Intl.DateTimeFormat('pt-BR',{dateStyle:'short',timeStyle:'short',timeZone:'America/Cuiaba'}).format(consultedAt) : 'não registrada';
    results.append(element('p','Data da consulta: '+consulted));
    if (data.warning) results.append(element('p',data.warning));
    const entries = Array.isArray(data.fipe) ? data.fipe : [];
    const comfort = /hb20s/i.test(data.model || vehicle.model) &&
      (/comfor/i.test([data.model,vehicle.model].join(' ')) || entries.some(row => ['0152188','0152170'].includes(String(row.code).replace(/\D/g,''))));
    const fipe = comfort ? ['0152188','0152170'].flatMap(code => {
      const match = entries.find(row => String(row.code).replace(/\D/g,'') === code);
      return match ? [match] : [];
    }) : entries;
    const references = element('div',undefined,'market-references');
    if (!fipe.length) results.append(element('p','A API não retornou valor FIPE para esta placa.'));
    fipe.forEach((row,index) => {
      const card = element('article',undefined,'market-card');
      if (comfort) card.append(element('strong',String(row.code).replace(/\D/g,'') === '0152188' ? 'Câmbio manual' : 'Câmbio automático'));
      else if (index === 0) card.append(element('strong','Melhor correspondência'));
      card.classList.add('fipe-card');
      card.append(element('h4',row.model || data.model));
      const metadata = element('dl',undefined,'fipe-metadata');
      [['Código FIPE',row.code],['Mês de referência',row.reference],['Combustível',row.fuel],['Ano-modelo',row.year]].forEach(([label,value]) => {
        if (!value) return;
        const field = element('div');
        field.append(element('dt',label),element('dd',value));
        metadata.append(field);
      });
      const value = element('div',undefined,'fipe-value');
      value.append(element('span','Valor FIPE'),element('strong',row.value));
      card.append(metadata,value);
      if (row.historyId) card.append(fipeHistory(row));
      references.append(card);
    });
    if (references.childElementCount) results.append(references);
    if (comfort && fipe.length < 2) results.append(element('p','A API ainda não retornou todos os códigos esperados (015218-8 e 015217-0).'));
    const labels = {brand:'Marca',model:'Modelo',year:'Ano (fabricação/modelo)',SUBMODELO:'Submodelo',VERSAO:'Versão',ano:'Ano informado',
      cor:'Cor',municipio:'Município',uf:'UF',origem:'Origem',situacao:'Situação',codigoSituacao:'Código da situação',data:'Data da base',
      placa_alternativa:'Placa alternativa',ano_fabricacao:'Ano de fabricação',ano_modelo:'Ano-modelo (base complementar)',
      combustivel:'Combustível',cilindradas:'Cilindradas',caixa_cambio:'Câmbio',carroceria:'Carroceria',eixos:'Eixos',especie:'Espécie',
      grupo:'Grupo',nacionalidade:'Nacionalidade',peso_bruto_total:'Peso bruto total',quantidade_passageiro:'Passageiros',
      segmento:'Segmento',sub_segmento:'Subsegmento',tipo_carroceria:'Tipo de carroceria',tipo_veiculo:'Tipo de veículo',cap_maxima_tracao:'Capacidade máxima de tração'};
    const specs = element('dl',undefined,'market-specs');
    const values = {brand:data.brand,model:data.model,...data.specs,year:vehicleYears({...vehicle,plateLookup:{data}})};
    Object.entries(labels).forEach(([key,label]) => {
      if (!values[key]) return;
      const field = element('div');
      field.append(element('dt',label),element('dd',values[key]));
      specs.append(field);
    });
    if (specs.childElementCount) results.append(element('h3','Dados da consulta de placa'),specs);
  }
  toolbar.append(heading,lookup);
  panel.append(toolbar,status,results);
  container.append(panel);
  if (vehicle.plateLookup?.plate === vehicle.plate && vehicle.plateLookup.data?.lookupMode !== 'cadastro') display(vehicle.plateLookup.data,vehicle.plateLookup.consultedAt);
  else status.textContent = 'Consulte a placa para carregar a FIPE e os dados do veículo.';
}

function details(vehicle) {
  const evaluating = master() && !vehicle.evaluated && Boolean(vehicle.answers?.length);
  const container = evaluating ? element('section',undefined,'evaluation-page') : $('#detail');
  if (evaluating) {
    updateRoute('evaluation',vehicle.id);
    page = 'evaluation';
    notice('');
    release(mediaUrls);
    release(dialogUrls);
    $('h1').textContent = 'Avaliar veículo';
    $('#intro').textContent = '';
    $('#content').replaceChildren(button('← Voltar para pendentes',() => show('pending')),container);
    window.scrollTo(0,0);
  }
  container.replaceChildren(element('h2',vehicle.model));
  if (vehicle.code) container.append(element('p',vehicle.code,'badge'));
  if (evaluating) {
    const info = element('section',undefined,'assessment-panel assessment-info');
    const list = element('ul');
    const specs = [['Ano (fabricação/modelo)',vehicleYears(vehicle)],['Quilometragem',number.format(vehicle.km)+' km'],
      ['Versão',vehicle.trim],['Tipo informado',vehicle.vehicleKind],['Categoria',vehicle.fipeType],['Combustível informado',vehicle.fipeFuel],['Placa',vehicle.plate],['Cidade',vehicle.city],
      ['Proprietário',vehicle.owner],['WhatsApp',vehicle.phone]];
    specs.forEach(([name,value]) => {
      if (!value) return;
      const item = element('li');
      item.append(element('strong',name+' · '),document.createTextNode(value));
      list.append(item);
    });
    info.append(element('h3','Dados do veículo e contato'),list);
    container.append(info);
    if (vehicle.plate) marketCards(vehicle,container);
    container.append(comparableListings(vehicle));
  }
  if (!evaluating) container.append(element('p',description(vehicle)));
  const photos = vehicle.photos?.length ? vehicle.photos : vehicle.photo ? [vehicle.photo] : [];
  if (photos.length) {
    const section = element('section',undefined,'vehicle-gallery');
    section.append(element('h3','Fotos do veículo · '+photos.length));
    const grid = element('div',undefined,'vehicle-gallery-grid');
    const checklistPhotos = checks.filter(([title]) => !photoOptionalItems.has(title));
    photos.forEach((file,index) => {
      const figure = element('figure');
      const title = photos.length === checklistPhotos.length ? checklistPhotos[index][0] : 'Foto '+(index+1);
      const image = photo({...vehicle,photo:file},dialogUrls);
      image.alt = title;
      image.loading = 'lazy';
      const open = element('a');
      Object.assign(open,{href:image.src,target:'_blank',rel:'noopener',title:'Ampliar '+title});
      open.append(image);
      figure.append(open,element('figcaption',title));
      grid.append(figure);
    });
    section.append(grid);
    container.append(section);
  } else if (!evaluating) container.append(photo(vehicle,dialogUrls));
  if (vehicle.evaluated) container.append(element('p',money.format(vehicle.value),'price'));
  if (!evaluating && master() && vehicle.owner) {
    container.append(element('p','Proprietário · '+vehicle.owner),element('p','WhatsApp · '+vehicle.phone));
  }
  if (vehicle.video) {
    const video = element('video');
    video.controls = true;
    video.playsInline = true;
    video.preload = 'metadata';
    video.src = media(vehicle.video,dialogUrls);
    container.append(video);
  }
  if (master() && vehicle.answers) showAssessment(vehicle,container);
  if (evaluating) {
    const form = element('form');
    const label = element('label','Valor da avaliação em reais');
    const input = element('input');
    Object.assign(input,{type:'number',min:'0.01',step:'0.01',inputMode:'decimal',required:true});
    label.append(input);
    const submit = element('button','Salvar avaliação e publicar no feed','primary');
    const feedback = element('p');
    feedback.setAttribute('role','status');
    form.append(element('h3','Avaliação final'),label,submit,feedback);
    form.onsubmit = async event => {
      event.preventDefault();
      if (!master()) return;
      submit.disabled = true;
      try {
        await save(vehicle,input.valueAsNumber);
        $('dialog').close();
        show('feed');
        notice('Avaliação '+vehicles.find(item => item.id === vehicle.id).code+' publicada no feed.');
      } catch {
        feedback.textContent = 'Não foi possível salvar a avaliação. Tente novamente.';
        submit.disabled = false;
      }
    };
    form.classList.add('assessment-final');
    container.append(form);
  }
  if (master() && vehicle.evaluated) {
    const unavailable = !vehicle.unavailable;
    const feedback = element('p');
    feedback.setAttribute('role','status');
    const action = button(unavailable ? 'Marcar como indisponível' : 'Recolocar no feed',async () => {
      if (!master()) return;
      action.disabled = true;
      try {
        await save({...vehicles.find(item => item.id === vehicle.id) || vehicle,unavailable});
        $('dialog').close();
        render();
        notice(unavailable ? 'Veículo retirado do feed.' : 'Veículo de volta ao feed.');
      } catch {
        feedback.textContent = 'Não foi possível alterar a disponibilidade. Tente novamente.';
        action.disabled = false;
      }
    });
    container.append(action,feedback);
  }
  if (evaluating) {
    const columns = element('div',undefined,'master-review');
    const primary = element('div',undefined,'master-review-main');
    const aside = element('aside',undefined,'master-review-aside');
    [...container.children].slice(1).forEach(section => {
      if (section.matches('.assessment-info,.assessment-summary,.assessment-final')) aside.append(section);
      else primary.append(section);
    });
    columns.append(primary,aside);
    container.append(columns);
  } else $('dialog').showModal();
}
function cards(container, list) {
  release(mediaUrls);
  container.replaceChildren();
  if (!list.length) container.append(element('p','Nenhum veículo encontrado.','empty'));
  list.forEach(vehicle => {
    const card = element('article',undefined,'card');
    card.append(photo(vehicle,mediaUrls),element('h2',vehicle.model),element('p',description(vehicle)));
    if (vehicle.evaluated) {
      card.append(element('p',money.format(vehicle.value),'price'),element('p','Avaliado em '+date.format(vehicle.evaluated)));
    } else {
      card.append(element('p','Aguardando avaliação','badge'));
    }
    if (page === 'feed' && vehicle.photo) {
      const download = element('a','Baixar foto','download-photo');
      download.href = card.querySelector('img').src;
      download.download = vehicle.photo.name || 'foto-do-veiculo';
      download.setAttribute('aria-label','Baixar foto de '+vehicle.model);
      card.append(download);
    }
    if (vehicle.code) card.append(element('p',vehicle.code,'badge'));
    if (vehicle.unavailable) card.append(element('p','Indisponível','badge'));
    if (vehicle.evaluated || vehicle.answers?.length) {
      card.append(button(vehicle.evaluated ? 'Ver detalhes' : 'Avaliar veículo',() => details(vehicle)));
    } else {
      const link = element('a','Preencher pré-avaliação','download-photo');
      link.href = '?pre-avaliacao';
      card.append(link);
    }
    container.append(card);
  });
}

    const metrics = [
      ['Publicados',vehicles.filter(item => item.evaluated && !item.unavailable).length,'feed'],
      ['Pendentes',vehicles.filter(item => !item.evaluated).length,'pending'],
      ['Retirados',vehicles.filter(item => item.unavailable).length,'unavailable']
    ];
    metrics.forEach(([label,count,destination]) => {
      const tile = button(label,() => show(destination),'master-metric');
      tile.dataset.metric = destination;
      tile.prepend(element('strong',count));
      summary.append(tile);
    });
    content.prepend(summary);
  }
  const grid = element('div',undefined,'grid master-vehicles');
  if (page === 'feed') {
    const search = element('input');
    Object.assign(search,{id:'search',type:'search',placeholder:'Buscar por código, modelo, versão ou ano'});
    search.setAttribute('aria-label','Buscar veículos avaliados');
    search.oninput = () => {
      const normalize = value => value.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
      const query = normalize(search.value.trim());
      cards(grid,list.filter(vehicle => normalize([vehicle.code,vehicle.model,vehicle.trim,vehicle.year].join(' ')).includes(query)));
    };
    content.append(search);
  }
  content.append(grid);
  cards(grid,list);
}

$('dialog').addEventListener('close',() => release(dialogUrls));
$('#role').onchange = () => {
  $('dialog').close();
  show($('#role').value === 'home' ? 'home' : 'feed');
};
if (new URLSearchParams(location.search).has("pre-avaliacao")) customerForm();
else readVehicles().then(result => {
  vehicles = result;
  restoreRoute();
  window.addEventListener('popstate',restoreRoute);
}).catch(() => notice('O armazenamento local está indisponível.'));
</script></body></html>
