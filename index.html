*{box-sizing:border-box}body{margin:0;background:#faf5f5;color:#2e2023;font:16px system-ui,sans-serif}header{background:#b0182c;color:#fff;padding:18px max(5vw,20px);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}header strong{font-size:27px;letter-spacing:-1px}main{max-width:1120px;margin:auto;padding:36px 20px}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:28px}button,select,input{font:inherit;border-radius:9px;padding:10px;border:1px solid #cbd5ce}button{cursor:pointer;background:#fff;color:#2e2023}button.primary,button[aria-current=true]{background:#b0182c;color:#fff;border-color:#b0182c}h1{font-size:clamp(30px,5vw,46px);letter-spacing:-.055em;margin:0}p{line-height:1.5;color:#52635b}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:16px}.card,form,.empty{background:white;border:1px solid #eadcde;border-radius:16px;padding:18px}article h2{margin:10px 0 0;font-size:21px}.media{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:9px;background:#e7eee8;display:grid;place-items:center;color:#51665a}.price{font-size:22px;font-weight:750;color:#b0182c}.badge{font-size:13px;padding:4px 9px;background:#f4ead1;border-radius:20px}label{display:grid;gap:6px;font-size:14px;font-weight:600}input{width:100%;min-width:0}form button{margin-top:12px}dialog{width:min(560px,94vw);border:1px solid #eadcde;border-radius:16px;padding:20px;max-height:90vh}dialog::backdrop{background:#142b2499}#status{min-height:1.5em}a{color:#b0182c}video{width:100%;margin-top:12px}#search{max-width:380px;margin-bottom:16px}

:root{--ink:#301419;--green:#b0182c;--line:#eadcde}
body{min-width:0}
header{padding-block:12px;padding-top:max(12px,env(safe-area-inset-top));gap:8px}
header label{display:flex;align-items:center;gap:8px;color:#d7e9df;font-size:13px}
header select{max-width:100%;color:var(--ink);background:#fff}
button,select,input{min-height:44px;font-size:16px}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #ba3144;outline-offset:3px}
button:disabled{opacity:.6;cursor:wait}
#status:empty{display:none}
#status:not(:empty){background:#e3eee6;padding:12px;border-radius:10px}
#search{max-width:none;background:white;padding-inline:14px}
.card{display:flex;flex-direction:column;gap:8px;overflow-wrap:anywhere}
.card h2,.card p{margin:0}
.card h2{margin-top:4px}
.card button{margin-top:auto;align-self:stretch}
.card .badge{align-self:flex-start}
form label{min-width:0}
input[type=file]{background:#f5f8f5;padding:6px}
input::file-selector-button{border:0;border-radius:6px;padding:8px;background:#e3eee6;color:var(--ink);font:inherit}
dialog{max-height:calc(100dvh - 32px);overflow:auto;color:var(--ink)}
dialog h2{margin-top:0;overflow-wrap:anywhere}
dialog video{max-height:45dvh;background:var(--ink);border-radius:9px}
@media(max-width:640px){
  header{padding-inline:max(16px,env(safe-area-inset-left)) max(16px,env(safe-area-inset-right))}
  header strong{font-size:24px}
  header label{gap:5px}
  header select{max-width:150px;padding:6px}
  main{padding:24px max(16px,env(safe-area-inset-right)) 24px max(16px,env(safe-area-inset-left))}
  body[data-profile=master] main{padding-bottom:calc(88px + env(safe-area-inset-bottom))}
  nav{display:none}
  body[data-profile=master] nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));position:fixed;inset:auto 0 0;z-index:1;margin:0;padding:8px max(12px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));background:white;border-top:1px solid var(--line);box-shadow:0 -6px 24px #30141910}
  nav button{min-width:0;min-height:48px;padding:6px;font-size:14px;font-weight:650}
  h1{font-size:34px;line-height:1.06}
  #intro{margin:10px 0 20px}
  .grid{grid-template-columns:minmax(0,1fr);gap:12px}
  .card,form{padding:14px}
  .card .media{aspect-ratio:16/8}
  form button{width:100%}
  #register .grid{gap:16px}
  dialog{width:100%;max-width:none;margin:auto 0 0;border-radius:20px 20px 0 0;padding:20px max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));max-height:calc(100dvh - max(12px,env(safe-area-inset-top)))}
}
.download-photo{display:grid;place-items:center;min-height:44px;padding:8px;border:1px solid #cbd5ce;border-radius:9px;text-decoration:none;font-weight:600}
.download-photo:focus-visible{outline:3px solid #ba3144;outline-offset:3px}

nav button[data-section]{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;background:var(--tab-bg);color:var(--tab-ink);font-weight:650;transition:background-color .15s,color .15s,transform .15s}
nav button[data-section=feed]{--tab-bg:#fce8eb;--tab-ink:#99182a}
nav button[data-section=pending]{--tab-bg:#fff0d4;--tab-ink:#795000}
nav button[data-section=unavailable]{--tab-bg:#f4e9f8;--tab-ink:#693584}
nav button[data-section=register]{--tab-bg:#e1effd;--tab-ink:#245185}
nav button[data-section][aria-current=true]{background:var(--tab-ink);color:white}
.nav-icon{display:grid;place-items:center;width:25px;height:25px;border-radius:7px;background:#ffffff85;color:var(--tab-ink);font:700 19px/1 system-ui,sans-serif}
nav button[aria-current=true] .nav-icon{background:#ffffff30;color:white}
@media(hover:hover){nav button[data-section]:hover{transform:translateY(-2px);border-color:var(--tab-ink)}}
nav button[data-section]:active{transform:scale(.97)}
@media(max-width:640px){
  nav button[data-section]{flex-direction:column;gap:3px;min-height:56px;padding:4px;font-size:12px}
  nav .nav-icon{width:23px;height:23px;font-size:17px}
}
@media(prefers-reduced-motion:reduce){nav button[data-section]{transition:none;transform:none}}
#pre-form{max-width:660px}#pre-form fieldset{min-width:0;border:0;padding:0}#pre-form legend{font-size:20px;font-weight:700;margin-bottom:16px}#pre-form label{margin-bottom:12px}#pre-form select{width:100%}.intake{display:grid;gap:12px;background:white;padding:16px;border:1px solid #eadcde;border-radius:14px;margin-bottom:16px}

.customer-app main{max-width:700px}
.customer-app h1{font-size:clamp(30px,6vw,44px);line-height:1.08}
.customer-app #intro{margin-bottom:20px}
#pre-form{max-width:none;padding:clamp(14px,4vw,28px);border-radius:20px}
.pre-progress{margin:0 0 10px;font-size:14px;font-weight:700;color:#b0182c}
.pre-steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;list-style:none;padding:0;margin:0 0 24px}
.pre-steps li{background:#f2f5f2;color:#52635b;border-radius:10px;padding:10px 4px;text-align:center;font-size:14px;font-weight:650}
.pre-steps li.complete{background:#fce8eb;color:#99182a}
.pre-steps li[aria-current=step]{background:#b0182c;color:white}
#pre-form input:not([type=radio]){background:#f7faf7;border-radius:10px;padding:10px 12px}
#pre-count{margin:0 0 16px;font-size:14px}
#pre-checks{display:grid;gap:14px}
#pre-form .pre-question{background:#f6f8f6;border:1px solid #eadcde;border-radius:12px;padding:10px;margin:0}
#pre-form .pre-question legend{font-size:16px;margin:0;padding:0 5px}
.pre-choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
#pre-form .pre-choice{position:relative;display:block;margin:0}
.pre-choice input{position:absolute;width:1px;height:1px;min-height:0;opacity:0}
.pre-choice span{display:grid;place-items:center;min-height:48px;padding:7px;text-align:center;background:white;color:#2e2023;border:2px solid #eadcde;border-radius:9px;cursor:pointer}
.pre-choice[data-tone=good]{--choice-color:#15563e;--choice-bg:#e2f3e9}
.pre-choice[data-tone=medium]{--choice-color:#795000;--choice-bg:#fff0d4}
.pre-choice[data-tone=bad]{--choice-color:#932e33;--choice-bg:#ffe9e9}
.pre-choice[data-tone=unknown]{--choice-color:#48566c;--choice-bg:#e9eef5}
.pre-choice input:checked+span{background:var(--choice-bg);border-color:var(--choice-color);color:var(--choice-color)}
.pre-choice input:focus-visible+span{outline:3px solid #ba3144;outline-offset:2px}
.pre-actions{display:flex;gap:8px;margin-top:18px}
.pre-actions button{margin:0;width:auto;min-height:48px}
.pre-actions .primary{flex:1}

.pre-diagram-caption{font-size:13px;margin:0 0 10px}
.pre-section{display:grid;gap:12px}
.pre-section+.pre-section{margin-top:12px}
.pre-section h3{margin:0;padding:10px 12px;border-radius:9px;background:#fce8eb;color:#99182a;font-size:16px}

#repair-report{display:none}
@media print{
  body:has(#repair-report) > :not(#repair-report){display:none!important}
  body:has(#repair-report){background:white}
  #repair-report{display:block;padding:12mm;font:12px system-ui,sans-serif;color:#301419}
  #repair-report .repair-brand{background:#301419;color:white;padding:12px;font-weight:800;letter-spacing:2px;print-color-adjust:exact}
  #repair-report h1{font-size:24px;margin-top:12px}
  #repair-report h2{font-size:17px}
  #repair-report table{width:100%;border-collapse:collapse}
  #repair-report th,#repair-report td{text-align:left;padding:5px;border-bottom:1px solid #eadcde}
  #repair-report tr{break-inside:avoid}
}

.pre-slider{display:block}
#pre-form .pre-slider input[type=range]{display:block;appearance:none;padding:0;border:0;background:transparent;min-height:44px;cursor:pointer;touch-action:pan-y}
.pre-slider input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:10px;background:linear-gradient(90deg,#2b9766,#e3ac42,#cf5258)}
.pre-slider input[type=range]::-moz-range-track{height:10px;border-radius:10px;background:linear-gradient(90deg,#2b9766,#e3ac42,#cf5258)}
.pre-slider input[type=range]::-webkit-slider-thumb{appearance:none;width:26px;height:26px;margin-top:-8px;border:3px solid #b0182c;background:white;border-radius:50%}
.pre-slider input[type=range]::-moz-range-thumb{width:20px;height:20px;border:3px solid #b0182c;background:white;border-radius:50%}
.pre-slider-labels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
.pre-slider-labels button{margin:0;padding:5px;font-size:13px;overflow-wrap:anywhere}
.pre-slider-labels button[aria-pressed=true]{background:#b0182c;color:white;border-color:#b0182c}

.evaluation-dialog{width:min(880px,calc(100% - 32px));max-height:calc(100dvh - 32px);padding:24px}
.evaluation-dialog #detail{display:grid;gap:14px}
.evaluation-dialog #detail>h2{margin:0;font-size:clamp(24px,4vw,34px)}
.evaluation-dialog #detail>.media{max-height:240px;object-fit:contain}
.assessment-panel{padding:16px;border:1px solid #eadcde;border-radius:12px;background:#f6f9f6;overflow-wrap:anywhere}
.assessment-panel h3,.evaluation-dialog form h3{margin:0 0 10px}
.assessment-panel h4{margin:16px 0 6px;color:#99182a}
.assessment-panel ul{padding-left:22px;margin:0}
.assessment-panel li{padding:5px 0}
.assessment-list li span{display:inline-block;margin-left:8px;color:#52635b}
.assessment-list li .assessment-cost{color:#99182a;font-weight:650}
@media(max-width:640px){
  .evaluation-dialog{width:100%;max-height:calc(100dvh - max(8px,env(safe-area-inset-top)));padding:16px 14px max(14px,env(safe-area-inset-bottom))}
  .assessment-list li span{display:block;margin-left:0}
}

.evaluation-page{display:grid;gap:16px;margin-top:16px}
.evaluation-page>h2{margin:0;font-size:clamp(24px,4vw,36px)}
.evaluation-page>.media{max-height:280px;object-fit:contain}
.evaluation-page>.assessment-panel{border-left:4px solid #b0182c}
.evaluation-page>.assessment-info{background:#edf5ff;border-left-color:#386fa4}
.evaluation-page>.assessment-info h3{color:#244f7a}
.evaluation-page>.assessment-summary{background:#fff4dc;border-left-color:#a66c15}
.evaluation-page>.assessment-summary h3{color:#795000}
.evaluation-page>.assessment-final{background:#f5edfb;border-left:4px solid #784994}
.evaluation-page>.assessment-final h3{color:#60377b;margin-top:0}
@media(min-width:800px){
  .evaluation-page{grid-template-columns:1fr 1fr;align-items:start}
  .evaluation-page>h2,.evaluation-page>.assessment-panel:not(.assessment-info):not(.assessment-summary){grid-column:1/-1}
}
.home-start{display:inline-grid;place-items:center;min-height:52px;padding:12px 20px;border-radius:10px;background:#b0182c;color:white;font-weight:700;text-decoration:none}
.home-start:focus-visible{outline:3px solid #ba3144;outline-offset:3px}
@media(max-width:640px){.home-start{width:100%}}

.home-hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);align-items:center;border:1px solid #eadcde;border-radius:20px;overflow:hidden;background:white;box-shadow:0 14px 40px #3014190d}
.home-artwork{display:grid;place-items:center;align-self:stretch;padding:clamp(12px,3vw,32px);background:#f8f4f4}
.home-artwork img{display:block;width:100%;height:auto;max-width:620px}
.home-copy{padding:clamp(24px,4vw,52px)}
.home-copy h1{max-width:15ch;font-size:clamp(30px,4vw,48px);line-height:1.05}
.home-copy p{max-width:36ch;margin:14px 0 22px}
.home-copy .home-start{min-height:52px}
@media(max-width:760px){
  .home-hero{grid-template-columns:1fr;max-width:540px;margin-inline:auto}
  .home-artwork{padding:14px 16px 8px}
  .home-copy{padding:20px}
  .home-copy h1{max-width:none;font-size:clamp(26px,6vw,34px)}
  .home-copy .home-start{width:100%}
}
.photo-guide{padding:14px;margin:0 0 16px;border:1px solid #ebc5cb;border-left:4px solid #b0182c;border-radius:10px;background:#fce8eb}
.photo-guide p{margin:6px 0 10px}
.photo-guide img{display:block;width:100%;height:auto;border-radius:8px}
.section-photo{margin-top:10px;padding:12px;background:#fce8eb;border:1px solid #ebc5cb;border-radius:10px}
.brand-logo{display:block;width:clamp(112px,35vw,188px);height:auto}
#pre-form .pre-mileage{padding:14px;border:2px solid #b0182c;border-radius:12px;background:#fce8eb;color:#861426}
#pre-form .pre-mileage input{background:#fff}
#pre-mileage-hint{font-weight:400}
.mileage-value{display:block;position:relative}
#pre-form .mileage-value input{padding-right:58px;appearance:textfield}
.mileage-value input::-webkit-inner-spin-button,.mileage-value input::-webkit-outer-spin-button{appearance:none;margin:0}
.mileage-unit{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-weight:700;pointer-events:none}

.walkaround{position:relative;overflow:hidden;border-radius:10px}
.walkaround-marker{position:absolute;top:0;left:0;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#b0182c;color:#fff;border:2px solid #fff;box-shadow:0 2px 8px #30141966;offset-path:ellipse(42% 39% at 50% 47%);offset-rotate:0deg;animation:walkaround-lap 7s linear 2}
@keyframes walkaround-lap{from{offset-distance:25%}to{offset-distance:125%}}

<strong id="photo-guide-title">Atenção à qualidade das fotos</strong>
<p>Use luz natural ou um ambiente claro. Mostre a peça inteira, com nitidez e sem obstruções. Confira as fotos antes de enviar: imagens escuras, cortadas ou borradas podem atrasar a avaliação.</p>

<aside class="photo-guide">
<strong>Antes de gravar</strong>
<ul><li>Estacione em um local seguro e bem iluminado. Prefira luz natural e evite filmar contra o sol.</li><li>Dê uma volta completa em torno do carro, mostrando a frente, as duas laterais e a traseira.</li><li>Ande devagar e mantenha o carro inteiro no quadro, sem cortes ou obstáculos.</li></ul>

<script>

const citySuggestions = ['Tangará da Serra','Barra do Bugres','Campo Novo do Parecis','Sapezal','Nova Olímpia','Denise','Arenápolis','Nortelândia','Santo Afonso','Diamantino','Nova Marilândia','São José do Rio Claro','Cuiabá','Várzea Grande','Lucas do Rio Verde','Nova Mutum','Sorriso','Sinop','Rondonópolis','Cáceres','Pontes e Lacerda','Juína','Brasnorte'];
const vehicleSuggestions = {
  Chevrolet:['Onix','Onix Plus','Spin','Tracker','S10','Montana','Cruze','Celta','Prisma','Classic','Cobalt'],
  Fiat:['Strada','Toro','Argo','Cronos','Mobi','Uno','Palio','Pulse','Fastback','Fiorino','Siena'],
  Ford:['EcoSport','Ka','Fiesta','Focus','Ranger','Fusion','Territory'],
  Volkswagen:['Gol','Polo','Virtus','Saveiro','Voyage','T-Cross','Nivus','Amarok','Fox','Jetta','Taos'],
  Toyota:['Corolla','Corolla Cross','Hilux','SW4','Yaris','Etios'],
  Hyundai:['HB20','HB20S','Creta','Tucson','ix35'],
  Honda:['Civic','City','Fit','HR-V','WR-V','ZR-V'],
  Renault:['Kwid','Sandero','Logan','Duster','Oroch','Captur','Kardian'],
  Jeep:['Renegade','Compass','Commander'],
  Nissan:['Kicks','Versa','March','Frontier','Sentra'],
  Mitsubishi:['L200','Outlander','ASX','Pajero Sport','Eclipse Cross'],
  Peugeot:['208','2008','308','3008','Partner'],
  'Citroën':['C3','C4 Cactus','Aircross','Basalt'],
  BYD:['Dolphin','Dolphin Mini','Song Plus','Yuan Plus','Seal'],
  GWM:['Haval H6','Ora 03','Poer'],
  Kia:['Sportage','Cerato','Soul','Picanto'],
  Suzuki:['Jimny','Vitara','S-Cross'],
  BMW:['Série 3','X1','X3'],
  'Mercedes-Benz':['Classe A','Classe C','GLA','GLC'],
  Audi:['A3','A4','Q3','Q5'],
  Volvo:['XC40','XC60','EX30'],
  Ram:['Rampage','1500','2500']
};
function configureCustomerFields(form) {
  const {phone,brand,model} = form.elements;
  function populate(id,values) {
    $(id).replaceChildren(...values.map(value => new Option(value,value)));
  }
  populate('#pre-cities',citySuggestions);
  populate('#pre-brands',Object.keys(vehicleSuggestions).sort((a,b) => a.localeCompare(b,'pt-BR')));
  brand.addEventListener('input',() => {
    const key = Object.keys(vehicleSuggestions).find(name =>
      name.localeCompare(brand.value.trim(),'pt-BR',{sensitivity:'base'}) === 0);
    populate('#pre-models',key ? vehicleSuggestions[key] : []);
  });
  phone.addEventListener('input',() => {
    let digits = phone.value.replace(/\D/g,'');
    if (digits.length > 11 && digits.startsWith('55')) digits = digits.slice(2);
    digits = digits.slice(0,11);
    const area = digits.slice(0,2);
    const local = digits.slice(2);
    const split = digits.length === 11 ? 5 : 4;
    phone.value = digits.length < 3 ? (area ? '('+area : '') :
      '('+area+') '+local.slice(0,split)+(local.length > split ? '-'+local.slice(split) : '');
    phone.setCustomValidity(digits.length >= 10 || !digits.length ? '' : 'Informe o DDD e o telefone completo.');
  });
}

const $ = selector => document.querySelector(selector);
const money = new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const number = new Intl.NumberFormat('pt-BR');
const date = new Intl.DateTimeFormat('pt-BR',{dateStyle:'medium'});

const photoOptionalItems = new Set(['Freios','Pneus','Suspensão','Câmbio','Vidros e travas elétricas','Ar-condicionado']);
const checks = [
 ['Porta esquerda',250,700],['Porta direita',250,700],['Para-choque dianteiro',250,650],
 ['Para-choque traseiro',250,650],['Capô e teto',350,1000],['Pneus',400,1200],
 ['Suspensão',450,1400],['Freios',350,950],['Motor',650,2200],['Câmbio',650,2200],
 ['Para-brisa',350,1200],['Faróis',250,850],['Ar-condicionado',400,1400],
 ['Bancos e estofamento',250,750],['Painel e comandos',300,1000],['Vidros e travas elétricas',250,800]
];
const checkSections = [
  ['Estrutura e exterior',[0,1,2,3,4,10,11]],
  ['Interior e conforto',[12,13,14,15]],
  ['Motor e câmbio',[8,9]],
  ['Suspensão, pneus e freios',[6,5,7]]
];
const options = index => index === 10 ? ['Sem avarias','Riscado ou lascado','Trincado ou quebrado','Não sei'] :
  index === 11 ? ['Funcionando','Opaco','Quebrado ou sem funcionar','Não sei'] :
  index < 5 ? ['Sem avarias','Arranhado','Amassado ou quebrado','Não sei'] : ['Ótimo','Bom','Ruim','Não sei'];
const fields = ['owner','phone','city','plate','model','year','km'];
function encode(file) {
  return new Promise((resolve,reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve({name:file.name,data:reader.result});
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function inspectionDiagram(index) {
  const illustration = element('div',undefined,'inspection-art');
  illustration.style.backgroundPosition = (index%4)*100/3+'% '+Math.floor(index/4)*100/3+'%';
  illustration.setAttribute('aria-hidden','true');
  return illustration;
}

function customerForm() {
  document.body.classList.add("customer-app");
  $('header label').remove();
  $('nav').remove();
  $('h1').textContent = 'Faça a avaliação do seu carro';
  $('#intro').textContent = 'Preencha a ficha para gerar a estimativa de reparos.';
  $('#content').append($('#pre-template').content.cloneNode(true));
  const form = $('#pre-form');
  configureCustomerFields(form);
  const {plate,brand,model,year} = form.elements;
  const lookupStatus = element('p');
  lookupStatus.setAttribute('role','status');
  const lookup = button('Consultar placa',async () => {
    const value = plate.value.trim().toUpperCase();
    if (!plate.reportValidity()) return;
    lookup.disabled = true;
    lookupStatus.textContent = 'Consultando placa…';
    try {
      const response = await fetch('./api/placa?placa='+encodeURIComponent(value),{signal:AbortSignal.timeout(10000)});
      if (!response.ok) throw Error('Consulta indisponível');
      const data = await response.json();
      if (plate.value.trim().toUpperCase() !== value) {
        lookupStatus.textContent = 'A placa mudou. Consulte novamente.';
        return;
      }
      if (data.brand) {
        brand.value = data.brand;
        brand.dispatchEvent(new Event('input'));
      }
      if (data.model) model.value = data.model;
      if (data.year) year.value = data.year;
      lookupStatus.textContent = 'Confira os dados e complete os campos que faltarem.';
    } catch {
      lookupStatus.textContent = 'Não foi possível consultar a placa. Preencha os dados manualmente.';
    } finally {
      lookup.disabled = false;
    }
  });
  plate.closest('label').after(lookup,lookupStatus);
  const steps = [...form.querySelectorAll('fieldset')];
  let step = 0;
  const back = $('#pre-back'), next = $('#pre-next');
  function display() {
    steps.forEach((section,index) => section.hidden = section.disabled = index !== step);
    back.hidden = step === 0;
    next.textContent = step === steps.length-1 ? 'Enviar pré-avaliação' : 'Continuar';
    $('#pre-progress').textContent = 'Etapa '+(step+1)+' de '+steps.length;
    form.querySelectorAll('.pre-steps li').forEach((item,index) => {
      item.classList.toggle('complete',index < step);
      if (index === step) item.setAttribute('aria-current','step');
      else item.removeAttribute('aria-current');
    });
    window.scrollTo(0,0);
  }
  checkSections.forEach(([name,indices]) => {
    const section = element('section',undefined,'pre-section');
    section.append(element('h3',name));
    indices.forEach(index => {
      const [title] = checks[index];
      const group = element('fieldset',undefined,'pre-question');
      const choices = element('div',undefined,'pre-choices');
      group.append(element('legend',title));
      group.append(inspectionDiagram(index));
      if (index < 2) {
        group.append(element('p',index === 0 ? 'Vista de fora, pelo lado esquerdo do carro.' : 'Vista de fora, pelo lado direito do carro.','pre-diagram-caption'));
      }
      group.append(choices);
      const ratings = options(index).slice(0,3);
      choices.classList.add('pre-slider');
      const slider = element('input');
      Object.assign(slider,{type:'range',min:'0',max:'2',step:'1',value:'1'});
      slider.setAttribute('aria-label',title);
      slider.setAttribute('aria-valuetext','Escolha uma condição');
      const answer = element('input');
      Object.assign(answer,{type:'hidden',name:'check'+index});
      const labels = element('div',undefined,'pre-slider-labels');
      function selectRating(value) {
        slider.value = answer.value = value;
        slider.setAttribute('aria-valuetext',ratings[value]);
        [...labels.children].forEach((item,position) =>
          item.setAttribute('aria-pressed',String(position === Number(value))));
        updateCount();
      }
      slider.oninput = slider.onchange = () => selectRating(slider.value);
      ratings.forEach((label,value) => {
        const choice = button(label,() => selectRating(value));
        choice.setAttribute('aria-pressed','false');
        labels.append(choice);
      });
      choices.append(slider,answer,labels);
      if (!photoOptionalItems.has(title)) {
        const photoLabel = element('label','Foto · '+title+' (até 8 MB)','section-photo');
        const photoInput = element('input');
        Object.assign(photoInput,{type:'file',name:'itemPhoto'+index,accept:'image/*',required:true});
        photoLabel.append(photoInput);
        group.append(photoLabel);
      }
      section.append(group);
    });
    $('#pre-checks').append(section);
  });
  function updateCount() {
    const count = [...form.querySelectorAll('.pre-slider input[type=hidden]')].filter(input => input.value !== '').length;
    $('#pre-count').textContent = count+' de '+checks.length+' itens respondidos';
  }
  $('#pre-checks').onchange = updateCount;
  updateCount();
  back.onclick = () => { notice(''); step--; display(); };
  form.onsubmit = async event => {
    event.preventDefault();
    if (step < steps.length-1) { step++; display(); return; }
    const missing = [...form.querySelectorAll('.pre-slider input[type=hidden]')].find(input => input.value === '');
    if (missing) {
      notice('Escolha uma condição para cada item do checklist.');
      missing.previousElementSibling.focus();
      return;
    }
    steps.forEach(section => section.disabled = false);
    const data = new FormData(form);
    display();
    const photos = checks.flatMap(([title],index) => photoOptionalItems.has(title) ? [] : [data.get('itemPhoto'+index)]);
    const video = data.get('video');
    if (photos.some(photo => photo.size > 8*1024**2) || video.size > 25*1024**2) {

      Object.assign(report,{id:crypto.randomUUID(),created:Date.now(),photo:photos[0],photos,video,
        answers:checks.map((_,index) => Number(data.get('check'+index)))});

      screen.remove();
      form.hidden = false;
      notice('Não foi possível concluir. Confira as fotos e tente novamente.');
    } finally {
      next.disabled = back.disabled = false;
    }
  };
  display();
}
function decode(media,kind,limit) {
  const match = typeof media?.data === 'string' && media.data.match(/^data:([a-z]+\/[a-z0-9.+-]+);base64,([a-z0-9+/=]+)$/i);
  if (!match || !match[1].startsWith(kind+'/')) throw Error('Mídia inválida');
  const bytes = Uint8Array.from(atob(match[2]),char => char.charCodeAt(0));
  if (!bytes.length || bytes.length > limit*1024**2) throw Error('Tamanho inválido');
  return new File([bytes],String(media.name || kind),{type:match[1]});
}
async function importAssessment(file) {
  if (file.size > 46*1024**2) throw Error('Tamanho inválido');
  const report = JSON.parse(await file.text());
  if (!report || report.version !== 1 || !/^[a-f0-9-]{36}$/i.test(report.id) ||
      !fields.every(key => typeof report[key] === 'string' && report[key].trim() && report[key].length <= 120) ||
      !/^[a-z]{3}[0-9][a-z0-9][0-9]{2}$/i.test(report.plate) ||
      !Number.isInteger(Number(report.year)) || Number(report.year)<1886 || Number(report.year)>2100 ||
      !Number.isSafeInteger(Number(report.km)) || Number(report.km)<0 ||
      !Array.isArray(report.answers) || ![10,checks.length].includes(report.answers.length) ||
      !report.answers.every(value => Number.isInteger(value) && value >= 0 && value <= 3)) throw Error('Ficha inválida');
  const id = 'pre-'+report.id;
  const vehicle = Object.fromEntries(fields.map(key => [key,report[key]]));
  Object.assign(vehicle,{id,created:Date.now(),answers:report.answers,photo:decode(report.photo,'image',8),video:decode(report.video,'video',25)});
  const db = await database;
  await new Promise((resolve,reject) => {
    const transaction = db.transaction('vehicles','readwrite');
    transaction.oncomplete = resolve;
    transaction.onabort = () => reject(transaction.error);
    transaction.objectStore('vehicles').add(vehicle);
  });
  vehicles = await readVehicles();
}

function repairRows(answers) {
  return answers.map((answer,index) => {
    const [name,minor,major] = checks[index];
    const center = [0,minor,major,0][answer];
    const painting = index < 5 && answer === 1;
    return {name,condition:options(index)[answer],pending:answer === 3,
      low:painting ? 500 : Math.floor(center*.75/50)*50,
      high:painting ? (index === 4 ? 1000 : 500) : Math.ceil(center*1.25/50)*50};
  });
}
function repairRange(low,high) {
  return low === high ? money.format(low) : money.format(low)+' a '+money.format(high);
}
function downloadFile(blob,name) {
  const url = URL.createObjectURL(blob);
  const link = element('a');
  link.href = url;
  link.download = name;
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url),30000);
}
async function repairReport(report) {
  try {
    downloadFile(await repairPdf(report),'avalia-top-estimativa-reparos.pdf');
  } catch {
    notice('Não foi possível gerar o PDF.');
  }
}
async function repairPdf(report) {
  const hex = value => Array.from(String(value),char => {
    const point = char === '\u00a0' ? 32 : char.codePointAt(0);
    return (point >= 32 && point <= 255 ? point : 63).toString(16).padStart(2,'0');
  }).join('');
  const text = (value,x,y,size = 11) =>
    'BT /F1 '+size+' Tf '+x+' '+y+' Td <'+hex(value)+'> Tj ET\n';
  const rows = repairRows(report.answers);
  const low = rows.reduce((sum,row) => sum+row.low,0);
  const high = rows.reduce((sum,row) => sum+row.high,0);
  let stream = '0.62 0.06 0.13 rg 36 738 523 66 re f\n1 1 1 rg\n';
  stream += text('AVALIA TOP',52,774,19)+text('Estimativa de reparos',52,751,13);
  stream += '0.07 0.17 0.14 rg\n';
  const model = Array.from(report.model || '');
  stream += text(model.slice(0,72).join(''),36,710);
  stream += text(model.slice(72).join(''),36,695);
  stream += text([report.code,report.year,report.plate,number.format(report.km)+' km'].filter(Boolean).join(' | '),36,676);
  rows.forEach((row,index) => {
    const y = 576-index*23;
    stream += text(row.name,36,y,10)+text(row.condition,220,y,10)
      +text(row.pending ? 'Conferir' : repairRange(row.low,row.high),393,y,10);
  });
  stream += '0.99 0.91 0.92 rg 36 600 523 61 re f\n0.07 0.17 0.14 rg\n';
  stream += text('TOTAL ESTIMADO',48,644,11);
  stream += text(repairRange(low,high),48,617,21);
  stream += text('Média: '+money.format((low+high)/2),365,618,11);
  const bottom = 576-rows.length*23-12;
  stream += text('Valores indicativos. Itens a conferir ficam fora do total.',36,bottom-46,10);
  stream += text('O custo final depende da inspeção e do orçamento da oficina.',36,bottom-62,10);
  const objects = [
    '<< /Type /Catalog /Pages 2 0 R >>',
    '<< /Type /Pages /Count 1 /Kids [3 0 R] >>',
    '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 4 0 R >> >> /Contents 5 0 R >>',
    '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>',
    '<< /Length '+stream.length+' >>\nstream\n'+stream+'endstream'
  ];
  let pdf = '%PDF-1.4\n';
  const offsets = objects.map((object,index) => {
    const offset = pdf.length;
    pdf += (index+1)+' 0 obj\n'+object+'\nendobj\n';
    return offset;
  });
  const xref = pdf.length;
  pdf += 'xref\n0 '+(objects.length+1)+'\n0000000000 65535 f \n';
  offsets.forEach(offset => { pdf += String(offset).padStart(10,'0')+' 00000 n \n'; });
  pdf += 'trailer\n<< /Size '+(objects.length+1)+' /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF\n';
  return new Blob([pdf],{type:'application/pdf'});
}

function showAssessment(vehicle,container) {
  const panel = element('section',undefined,'assessment-panel');
  panel.append(element('h3','Pré-avaliação do cliente'));
  const rows = repairRows(vehicle.answers);
  let total = 0;
  checkSections.forEach(([title,indices]) => {

  summary.append(element('h3','Resumo de valores'),element('p','Desconto indicativo · '+money.format(total),'price'),

const database = new Promise((resolve,reject) => {
  const request = indexedDB.open('consigna',1);
  request.onupgradeneeded = () => {
    const store = request.result.createObjectStore('vehicles',{keyPath:'id'});
    sample.forEach(vehicle => store.add(vehicle));
  };
  request.onsuccess = () => resolve(request.result);
  request.onerror = () => reject(request.error);
});
let vehicles = [], page = 'home', mediaUrls = [], dialogUrls = [];
const master = () => $('#role').value === 'master';
function element(tag, value, className) {
  const node = document.createElement(tag);
  if (value !== undefined) node.textContent = value;
  if (className) node.className = className;
  return node;
}
function button(label, action, style) {
  const node = element('button',label,style);
  node.type = 'button';
  node.onclick = action;
  return node;
}
async function readVehicles() {
  const db = await database;
  return new Promise((resolve,reject) => {
    const request = db.transaction('vehicles').objectStore('vehicles').getAll();
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}
async function save(vehicle,finalValue) {
  const db = await database;
  await new Promise((resolve,reject) => {
    const transaction = db.transaction('vehicles','readwrite');
    transaction.oncomplete = resolve;
    transaction.onabort = () => reject(transaction.error);
    const store = transaction.objectStore('vehicles');
    if (finalValue === undefined) {
      store.put(vehicle);
      return;
    }
    const request = store.getAll();
    request.onsuccess = () => {
      const current = request.result.find(item => item.id === vehicle.id);
      if (!current?.answers?.length || current.evaluated) {
        transaction.abort();
        return;
      }
      const last = request.result.reduce((max,item) => Math.max(max,Number(item.code?.match(/^COD(\d+)$/)?.[1] || 0)),0);
      const code = 'COD'+String(last+1).padStart(4,'0');
      store.put({...current,code,value:finalValue,evaluated:Date.now()});
    };
  });
  vehicles = await readVehicles();
}

function media(blob, urls) {

}
function release(urls) { urls.splice(0).forEach(url => URL.revokeObjectURL(url)); }

    video.src = media(vehicle.video,dialogUrls);

  }

  if (evaluating) {
    const form = element('form');
    const label = element('label','Valor da avaliação em reais');
    const input = element('input');
    Object.assign(input,{type:'number',min:'0.01',step:'0.01',inputMode:'decimal',required:true});

    form.append(element('h3','Avaliação final'),label,submit,feedback);

      event.preventDefault();
      if (!master()) return;
      submit.disabled = true;
      try {
        await save(vehicle,input.valueAsNumber);
        $('dialog').close();
        show('feed');
        notice('Avaliação '+vehicles.find(item => item.id === vehicle.id).code+' publicada no feed.');
      } catch {
        feedback.textContent = 'Não foi possível salvar a avaliação. Tente novamente.';

      }

  }

    const unavailable = !vehicle.unavailable;
    const feedback = element('p');
    feedback.setAttribute('role','status');
    const action = button(unavailable ? 'Marcar como indisponível' : 'Recolocar no feed',async () => {
      if (!master()) return;
      action.disabled = true;
      try {
        await save({...vehicle,unavailable});
        $('dialog').close();
        render();
        notice(unavailable ? 'Veículo retirado do feed.' : 'Veículo de volta ao feed.');
      } catch {
        feedback.textContent = 'Não foi possível alterar a disponibilidade. Tente novamente.';
        action.disabled = false;
      }
    });
    container.append(action,feedback);
  }

    const label = element('label','Importar ficha do cliente');
    const file = element('input');
    Object.assign(file,{type:'file',accept:'.json,application/json'});
    file.onchange = async () => {
      if (!master() || !file.files[0]) return;
      file.disabled = true;
      try {
        await importAssessment(file.files[0]);
        render();
        notice('Pré-avaliação importada para Pendentes.');
      } catch (error) {
        notice(error?.name === 'ConstraintError' ? 'Esta ficha já foi importada.' : 'Não foi possível importar. Confira o arquivo recebido.');
        file.value = '';
        file.disabled = false;
      }
    };
    label.append(file);
    intake.append(label);
    content.append(intake);
  }
  const grid = element('div',undefined,'grid');
  if (page === 'feed') {
    const search = element('input');
    Object.assign(search,{id:'search',type:'search',placeholder:'Buscar por código, modelo, versão ou ano'});
    search.setAttribute('aria-label','Buscar veículos avaliados');
    search.oninput = () => {
      const normalize = value => value.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
      const query = normalize(search.value.trim());
      cards(grid,list.filter(vehicle => normalize([vehicle.code,vehicle.model,vehicle.trim,vehicle.year].join(' ')).includes(query)));
    };
    content.append(search);
  }
  content.append(grid);
  cards(grid,list);
}

$('dialog').addEventListener('close',() => release(dialogUrls));
$('#role').onchange = () => {
  $('dialog').close();
  show($('#role').value === 'home' ? 'home' : 'feed');
};
if (new URLSearchParams(location.search).has("pre-avaliacao")) customerForm();
else readVehicles().then(result => { vehicles = result; render(); }).catch(() => notice('O armazenamento local está indisponível.'));
</script></body></html>
