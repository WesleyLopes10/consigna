<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AvaliaTop · Inspeção 3D</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#edf0f3;color:#1e242b;font:16px system-ui,sans-serif}main{margin:auto;max-width:600px;background:#fff;height:100vh;height:100dvh;display:flex;flex-direction:column;padding:12px 16px max(10px,env(safe-area-inset-bottom));gap:9px}header,.row,nav{display:flex;align-items:center;justify-content:space-between;gap:8px}header strong{font-size:23px;letter-spacing:-1px}em{color:#b31530;font-style:normal}button,.photo{font:inherit;color:inherit;background:white;border:1px solid #d2d8df;border-radius:10px;min-height:44px;cursor:pointer;padding:6px 10px}header button{border:0}.row{font-size:14px;color:#4c5560}progress{display:block;width:100%;height:6px;border:0;appearance:none;border-radius:8px;overflow:hidden;background:#e6e9ed}progress::-webkit-progress-bar{background:#e6e9ed}progress::-webkit-progress-value{background:#b31530}progress::-moz-progress-bar{background:#b31530}h1{margin:0;font-size:clamp(21px,5.5vw,30px);line-height:1.14}canvas{flex:1 1 0;min-height:90px;width:100%;display:block;background:radial-gradient(ellipse at 50% 45%,#fff,#e7ebee);border-radius:14px;touch-action:none}fieldset{margin:0;padding:0;border:0}legend{font-weight:650;margin-bottom:6px}.ratings{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:5px}.ratings button{font-size:14px;line-height:1.15;font-weight:600;border-top:4px solid var(--color)}.ratings button[aria-pressed=true]{background:var(--color);color:#112018;box-shadow:inset 0 0 0 2px #252b31}.photo{position:relative;display:flex;align-items:center;gap:10px;background:#f7f8fa}.photo input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}.photo:focus-within{outline:2px solid #246abd}.photo img{width:38px;height:38px;object-fit:cover;border-radius:6px}.photo span{font-size:14px}.photo b{display:block}.photo small{display:block;color:#535d68}nav{border-top:1px solid #e3e6ea;padding-top:8px}nav button{font-size:24px;min-width:56px;line-height:1}nav span{font-size:14px}#next{background:#a9142c;color:white;border-color:#a9142c}button:disabled{opacity:.4;cursor:default}dialog{width:min(92vw,410px);border:0;border-radius:14px;padding:20px}dialog::backdrop{background:#17202a88}#summary button{margin:3px}.photo img[hidden]{display:none}@media(max-height:580px){main{gap:4px;padding-top:4px}header strong{font-size:19px}.photo{min-height:40px}nav{padding-top:4px}legend{margin:0}}
fieldset .ratings{gap:6px;grid-template-columns:1fr 1fr 1.35fr}.ratings button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:1px solid #cdd3da;border-radius:12px;min-height:59px;padding:5px 3px;color:#333b45;background:#fff}.ratings .mark{display:grid;place-items:center;width:21px;height:21px;border-radius:50%;color:var(--accent);background:var(--wash);font-weight:800}.ratings button[aria-pressed=true]{background:var(--wash);border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);color:var(--accent)}.ratings button[aria-pressed=true] .mark{background:var(--accent);color:white}nav button{width:52px;height:44px;border-radius:22px;font-size:22px}nav #next{background:#b01530}button:focus-visible{outline:3px solid #476aad;outline-offset:2px}</style><main><header><strong>Avalia<em>Top</em></strong><button aria-label="Créditos do modelo" onclick="document.querySelector('#credits').showModal()">ⓘ</button></header>
<div class="row"><strong id="view"></strong><span id="count"></span></div><progress id="bar" aria-label="Peças avaliadas"></progress>
<h1 id="title" aria-live="polite"></h1><canvas id="car" aria-label="Polestar 2. Arraste para girar ou toque em uma peça."></canvas>
<fieldset><legend>Condição da peça</legend><div class="ratings"></div></fieldset>
<label class="photo"><img id="thumb" hidden alt="Foto da vista"><span><b id="photoAction"></b><small id="photoHint"></small></span><input id="file" type="file" accept="image/*" aria-label="Anexar ou trocar foto da vista"></label>
<nav><button id="prev" aria-label="Etapa anterior">←</button><span id="step"></span><button id="next" aria-label="Próxima etapa">→</button></nav>
<dialog id="summary"><h2>Resumo da inspeção</h2><p id="result"></p><button id="review">Voltar às peças</button><button id="finish">Continuar para mecânica</button></dialog>
<dialog id="credits" aria-labelledby="credit-title"><h2 id="credit-title">Créditos do modelo</h2><p>Modelo <a href="https://sketchfab.com/3d-models/2020-polestar-2-24f78b3dc6e84fe0b0b2afdb43d547ea">2020 Polestar 2</a> de <a href="https://sketchfab.com/ddiaz-design">Ddiaz Design</a>. Adaptação interativa sob <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/">CC BY-NC-SA 4.0</a>.</p><form method="dialog"><button>Fechar</button></form></dialog></main>
<script type="module">
const canvas = document.querySelector('#car');

const parts = new Map();
const batches = new Map();
const ratings = [['Bom','#35ab68'],['Arranhado','#f5952c'],['Amassado ou quebrado','#e33d50']];
const silver='#aeb8c6', glass='#3b4c61', rubber='#252830', trim='#323846';
let selected='', yaw=1.03, pitch=.14, gesture;
const mix=(a,b,t)=>a+(b-a)*t;
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const minus=(a,b)=>a.map((v,i)=>v-b[i]);
const unit=v=>{const d=Math.hypot(...v);return d>1e-8?v.map(n=>n/d):[0,1,0]};
const color=hex=>hex.slice(1).match(/../g).map(c=>parseInt(c,16)/255);
const encoded = (await Promise.all([0,1,2,3].map(async index=>{
 const response=await fetch('./assets/model3d-'+index+'.txt');
 if(!response.ok)throw Error('Não foi possível carregar o modelo 3D.');
 return response.text();
}))).join('');
const compressed=Uint8Array.from(atob(encoded),c=>c.charCodeAt(0));
const geometry=JSON.parse(await new Response(new Blob([compressed]).stream().pipeThrough(new DecompressionStream('deflate'))).text());
for(const [name,paint,encoded] of geometry){
 const bytes=Uint8Array.from(atob(encoded),c=>c.charCodeAt(0));
 const data=Float32Array.from(new Int16Array(bytes.buffer),v=>v/9000);
 if(name&&!name.startsWith('Roda ')&&!parts.has(name))parts.set(name,{id:parts.size+1,value:null});
 batches.set(batches.size,{name,paint,data,shine:.55});
}
const ctx = canvas.getContext('2d');
let depth, ids, frame;
const pixelRatio=1.35;
function draw(){
  if(!ctx)return;
  const rect=canvas.getBoundingClientRect();
  const density=Math.min(devicePixelRatio,pixelRatio,730/Math.max(1,rect.width));
  const w=Math.max(1,Math.round(rect.width*density));
  const h=Math.max(1,Math.round(rect.height*density));
  if(!frame||canvas.width!==w||canvas.height!==h){
    canvas.width=w;
    canvas.height=h;
    frame=ctx.createImageData(w,h);
    depth=new Float32Array(w*h);
    ids=new Uint8Array(w*h);
  }
  const rgba=frame.data;
  rgba.fill(0);
  depth.fill(-Infinity);
  ids.fill(0);
  const scale=Math.min(w*.174,h*.30);
  const yawCos=Math.cos(yaw),yawSin=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);
  const eye=[-yawCos*cp,sp,yawSin*cp];
  const light=unit([-.58,.89,.62]);
  const half=unit(light.map((v,i)=>v+eye[i]));
  const dot=(x,y,z,v)=>x*v[0]+y*v[1]+z*v[2];
  // Render each triangle with a depth buffer. The visible part ID follows the same depth test.
  const edge=(ax,ay,bx,by,x,y)=>(bx-ax)*(y-ay)-(by-ay)*(x-ax);
  for(const batch of batches.values()){
    const part=parts.get(batch.name);
    const rating=ratings[part?.value];
    const tint=rating?color(rating[1]):batch.paint;
    const active=selected&&selected===batch.name;
    const id=part?.id??0;
    const vertices=batch.data;
    for(let i=0;i<vertices.length;i+=18){
      const points=[];
      for(let j=i;j<i+18;j+=6){
        const x=vertices[j],y=vertices[j+1]-.79,z=vertices[j+2];
        const cameraZ=-yawCos*x+yawSin*z;
        const d=cameraZ*cp+y*sp;
        const perspective=1-.070*d;
        points.push([w/2+(yawSin*x+yawCos*z)*scale/perspective,h/2-(y*cp-cameraZ*sp)*scale/perspective,d/perspective]);
      }
      const [[ax,ay,az],[bx,by,bz],[cx,cy,cz]]=points;
      const area=edge(ax,ay,bx,by,cx,cy);
      if(Math.abs(area)<.04)continue;
      const startX=Math.max(0,Math.floor(Math.min(ax,bx,cx)));
      const endX=Math.min(w-1,Math.ceil(Math.max(ax,bx,cx)));
      const startY=Math.max(0,Math.floor(Math.min(ay,by,cy)));
      const endY=Math.min(h-1,Math.ceil(Math.max(ay,by,cy)));
      const shades=[i,i+6,i+12].map(j=>{
        const x=vertices[j+3],y=vertices[j+4],z=vertices[j+5];
        return .55+.35*Math.max(0,dot(x,y,z,light))+.11*Math.max(0,y);
      });
      const highlights=[i,i+6,i+12].map(j=>{
        const x=vertices[j+3],y=vertices[j+4],z=vertices[j+5];
        return batch.shine*(.29*Math.max(0,dot(x,y,z,half))**15+.13*Math.max(0,y)**6);
      });
      for(let y=startY;y<=endY;y++)for(let x=startX;x<=endX;x++){
        const a=edge(bx,by,cx,cy,x+.5,y+.5)/area;
        const b=edge(cx,cy,ax,ay,x+.5,y+.5)/area;
        const c=1-a-b;
        if(a<0||b<0||c<0)continue;
        const z=a*az+b*bz+c*cz, pixel=y*w+x;
        if(z<=depth[pixel])continue;
        depth[pixel]=z;
        ids[pixel]=id;
        const shade=a*shades[0]+b*shades[1]+c*shades[2];
        const gloss=a*highlights[0]+b*highlights[1]+c*highlights[2];
        const k=4*pixel;
        rgba[k]=(tint[0]*shade+gloss+(active?.025:0))*255;
        rgba[k+1]=(tint[1]*shade+gloss+(active?.055:0))*255;
        rgba[k+2]=(tint[2]*shade+gloss+(active?.12:0))*255;
        rgba[k+3]=255;
      }
    }
  }
  ctx.putImageData(frame,0,0);
  ctx.save();
  ctx.globalCompositeOperation='destination-over';
  ctx.translate(w*.50,h*.68);
  ctx.scale(scale*1.65,scale*.28);
  const shadow=ctx.createRadialGradient(0,0,.12,0,0,1);
  shadow.addColorStop(0,'rgba(24,35,55,.28)');
  shadow.addColorStop(1,'rgba(24,35,55,0)');
  ctx.fillStyle=shadow;
  ctx.fillRect(-1,-1,2,2);
  ctx.restore();
}
let queued=false;
function requestDraw(){
  if(queued)return;
  queued=true;
  requestAnimationFrame(()=>{queued=false;draw()});
}
const $=selector=>document.querySelector(selector);
const route=[];
function section(view,yaw,pitch,names){
 for(const name of names)route.push({view,yaw,pitch,name});
}
section('Frente',0,.30,['Para-choque dianteiro','Faróis','Capô','Para-brisa']);
section('Teto',1.57,1.37,['Teto']);
function lateral(side,names){
 const feminine=side==='esquerdo'?'esquerda':'direita';
 section('Lateral '+feminine,side==='esquerdo'?1.57:-1.57,.18,names.map(n=>n+' '+(['Paralama dianteiro','Retrovisor'].includes(n)?side:feminine)));
}
const sideParts=['Paralama dianteiro','Retrovisor','Porta dianteira','Porta traseira','Lateral traseira'];
lateral('esquerdo',sideParts);
section('Traseira',Math.PI,.31,['Vidro traseiro','Porta-malas','Lanternas traseiras','Para-choque traseiro']);
lateral('direito',[...sideParts].reverse());
const photos=new Map();
const photoFiles=new Map();
let index=0;
const buttons=ratings.map(([label,hex],rating)=>{
 const button=document.createElement('button');
 const mark=document.createElement('span');mark.className='mark';mark.setAttribute('aria-hidden','true');mark.textContent=['✓','≋','!'][rating];
 const caption=document.createElement('span');caption.textContent=label;
 button.append(mark,caption);button.style.setProperty('--accent',['#177247','#a34e06','#a32034'][rating]);button.style.setProperty('--wash',['#eaf6ee','#fff3e4','#fcecf0'][rating]);
 button.onclick=()=>{parts.get(selected).value=rating;refresh()};
 $('.ratings').append(button);
 return button;
});
function go(i){
 index=i;
 const item=route[i];selected=item.name;yaw=item.yaw;pitch=item.pitch;
 refresh();
}
function refresh(){
 const item=route[index],value=parts.get(selected).value;
 buttons.forEach((b,i)=>b.setAttribute('aria-pressed',String(value===i)));
 const count=route.filter(r=>parts.get(r.name).value!==null).length;
 $('#bar').max=route.length;$('#bar').value=count;
 $('#count').textContent=count+' de '+route.length+' avaliadas';
 $('#view').textContent=item.view;$('#title').textContent=selected;
 $('#step').textContent='Etapa '+(index+1)+' de '+route.length;
 $('#prev').disabled=index===0;
 $('#next').textContent=index===route.length-1?'✓':'→';
 $('#next').setAttribute('aria-label',index===route.length-1?'Ver resumo':'Próxima etapa');
 const photo=photos.get(item.view);
 $('#photoAction').textContent=(photo?'Trocar foto':'Anexar foto')+' · '+item.view;
 $('#photoHint').textContent=photo?'Foto anexada a esta vista':'Uma foto para as peças desta vista';
 const thumb=$('#thumb');thumb.hidden=!photo;
 if(photo)thumb.src=photo;else thumb.removeAttribute('src');
 draw();
}
$('#prev').onclick=()=>{if(index>0)go(index-1)};
$('#next').onclick=()=>{
 if(index<route.length-1){go(index+1);return}
 const pending=route.filter(r=>parts.get(r.name).value===null).length;
 $('#result').textContent=(pending?pending+' peça(s) pendente(s).':'Todas as peças avaliadas.')+' '+photos.size+' de 5 vistas com foto.';
 $('#review').textContent=pending?'Revisar peças pendentes':'Voltar às peças';
 $('#finish').disabled=Boolean(pending);
 $('#summary').showModal();
};
$('#finish').onclick=()=>{
 const pending=route.findIndex(r=>parts.get(r.name).value===null);
 if(pending>=0){$('#summary').close();go(pending);return;}
 parent.postMessage({type:'avaliatop-3d-complete',answers:route.map(r=>({name:r.name,value:parts.get(r.name).value})),photos:[...photoFiles].map(([view,file])=>({view,file}))},location.origin);
 $('#summary').close();
};
$('#review').onclick=()=>{$('#summary').close();const first=route.findIndex(r=>parts.get(r.name).value===null);go(first<0?0:first)};
$('#file').onchange=event=>{
 const file=event.target.files[0];if(!file)return;
 if(file.size>5*1024**2){alert('Use uma foto de até 5 MB.');event.target.value='';return;}
 photoFiles.set(route[index].view,file);
 const view=route[index].view;
 if(photos.has(view))URL.revokeObjectURL(photos.get(view));
 photos.set(view,URL.createObjectURL(file));event.target.value='';refresh();
};
canvas.onpointerdown=event=>{
  if(!event.isPrimary||event.button!==0)return;
  gesture={x:event.clientX,y:event.clientY,yaw,pitch,moved:false};
  canvas.setPointerCapture(event.pointerId);
};
canvas.onpointermove=event=>{
  if(!gesture||!event.isPrimary)return;
  const dx=event.clientX-gesture.x,dy=event.clientY-gesture.y;
  if(!gesture.moved&&Math.hypot(dx,dy)<6)return;
  gesture.moved=true;
  yaw=(gesture.yaw+dx*.012)%(Math.PI*2);
  pitch=Math.max(.045,Math.min(1.51,gesture.pitch+dy*.008));
  requestDraw();
};
canvas.onpointerup=event=>{
  if(!gesture||!event.isPrimary)return;
  const tapped=!gesture.moved;
  gesture=undefined;
  if(!tapped||!ids)return;
  const rect=canvas.getBoundingClientRect();
  const x=Math.floor((event.clientX-rect.left)*canvas.width/rect.width);
  const y=Math.floor((event.clientY-rect.top)*canvas.height/rect.height);
  if(x<0||y<0||x>=canvas.width||y>=canvas.height)return;
  if(queued)draw();
  const id=ids[y*canvas.width+x];
  const name=[...parts].find(([,part])=>part.id===id)?.[0];
  if(name){index=route.findIndex(r=>r.name===name);selected=name;}
  refresh();
};
canvas.onpointercancel=()=>{gesture=undefined};
if(ctx){
  if(typeof ResizeObserver==='function')new ResizeObserver(requestDraw).observe(canvas);
  else window.addEventListener('resize',requestDraw);
}else{
  canvas.hidden=true;
  const message=document.createElement('p');
  message.textContent='Para girar o carro, abra este arquivo em um navegador. Você pode avaliar pelas setas.';
  canvas.after(message);
}
go(0);
</script></html>
